<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagramas y Logos Ambientales</title>
<style>
:root {
  --primario: #1A4488; --acento: #CB1823; --texto: #33404F;
  --medio: #8A94A0; --claro: #C9D0D8; --fondo: #F4F6F9; --blanco: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; }
header { background: var(--blanco); border-bottom: 1px solid var(--claro); padding: 18px 28px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 50; }
header .marca { width: 42px; height: 42px; flex: none; }
header h1 { font-size: 20px; font-weight: 700; color: var(--primario); }
header p { font-size: 13px; color: var(--medio); }
.tabs { display: flex; gap: 8px; margin-left: auto; }
.tab { padding: 9px 20px; border-radius: 999px; border: 1.5px solid var(--claro); background: var(--blanco); font-size: 14px; font-weight: 600; cursor: pointer; }
.tab.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
#buscador { flex: 1 1 260px; min-width: 220px; padding: 11px 16px; border: 1.5px solid var(--claro); border-radius: 10px; font-size: 15px; outline: none; background: var(--blanco); }
#buscador:focus { border-color: var(--primario); }
select { padding: 10px 14px; border: 1.5px solid var(--claro); border-radius: 10px; font-size: 14px; background: var(--blanco); color: var(--texto); outline: none; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
.chip { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--claro); background: var(--blanco); font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--primario); }
.chip.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
#contador { font-size: 13px; color: var(--medio); margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.tarjeta { background: var(--blanco); border: 1.5px solid var(--claro); border-radius: 14px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; }
.tarjeta:hover { border-color: var(--primario); box-shadow: 0 8px 24px rgba(26,68,136,.14); transform: translateY(-2px); }
.tarjeta .thumb { display: flex; align-items: center; justify-content: center; padding: 10px; min-height: 120px; }
.tarjeta .thumb svg { width: 100%; height: auto; }
.tarjeta .pie { padding: 10px 14px; border-top: 1px solid #EEF1F5; }
.tarjeta .pie strong { display: block; font-size: 13.5px; font-weight: 600; }
.tarjeta .pie span { font-size: 12px; color: var(--medio); }
#modal { display: none; position: fixed; inset: 0; background: rgba(30,40,55,.55); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
#modal.abierto { display: flex; }
.editor { background: var(--blanco); border-radius: 18px; width: min(1150px, 96vw); max-height: 94vh; overflow: auto; display: grid; grid-template-columns: 1.35fr 1fr; }
@media (max-width: 900px) { .editor { grid-template-columns: 1fr; } }
.editor .vista { padding: 24px; display: flex; align-items: center; justify-content: center; background: var(--fondo); }
.editor .vista svg { max-width: 100%; height: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.editor .panel { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.editor h2 { font-size: 18px; color: var(--primario); }
.editor .sub { font-size: 13px; color: var(--medio); }
.editor label { font-size: 12.5px; font-weight: 600; display: block; margin-bottom: 5px; }
.editor select, .editor input[type="text"], .editor input[type="range"] { width: 100%; }
.editor select, .editor input[type="text"] { padding: 9px 12px; border: 1.5px solid var(--claro); border-radius: 9px; font-size: 14px; outline: none; }
.editor input[type="text"]:focus { border-color: var(--primario); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: transform .12s; }
.swatch:hover { transform: scale(1.12); }
.swatch.activo { border-color: var(--texto); }
#listaTextos { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow: auto; }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn { padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn-primario { background: var(--primario); color: #fff; }
.btn-secundario { background: #E8EDF4; color: var(--primario); }
.btn-cerrar { background: none; border: none; font-size: 26px; color: var(--medio); cursor: pointer; line-height: 1; padding: 4px 8px; align-self: flex-end; }
.cabecera-panel { display: flex; justify-content: space-between; align-items: flex-start; }
footer { text-align: center; padding: 26px; font-size: 12.5px; color: var(--medio); }
.vacio { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--medio); }
.oculto { display: none !important; }
</style>
</head>
<body>
<header>
  <svg class="marca" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1A4488"/><path d="M24 10c-7 4-10 10-8 17 3 1 7 1 10-1 4-2 6-7 5-11-1-3-4-5-7-5zm-1 6c2 3 3 7 2 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M15 34c6 2 12 2 18 0" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
  <div>
    <h1>Diagramas y Logos Ambientales</h1>
    <p>Crea cuadros y esquemas a tu medida: 50 diagramas + 50 logos · colores corporativos · sin instalar nada</p>
  </div>
  <div class="tabs">
    <button class="tab activo" id="tabDiagramas">Diagramas</button>
    <button class="tab" id="tabLogos">Logos</button>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="buscador" type="text" placeholder="Buscar… (proceso, ciclo, árbol…)">
    <select id="filtroEsquema"><option value="">Todos los colores</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="contador"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Editor de cuadros y logotipos para documentación ambiental · funciona sin conexión · sin recoger datos</footer>

<div id="modal">
  <div class="editor">
    <div class="vista" id="vista"></div>
    <div class="panel">
      <div class="cabecera-panel">
        <div><h2 id="titEditor"></h2><p class="sub" id="subEditor"></p></div>
        <button class="btn-cerrar" id="btnCerrar">✕</button>
      </div>
      <div>
        <label>Color</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div id="bloqueTextos">
        <label>Textos de los elementos</label>
        <div id="listaTextos"></div>
      </div>
      <div id="bloquePasos">
        <label for="selPasos">Número de elementos</label>
        <select id="selPasos"></select>
      </div>
      <div id="bloqueLogo">
        <label for="selLogo">Logo incrustado en el centro (opcional)</label>
        <select id="selLogo"></select>
      </div>
      <div id="bloqueFondo">
        <label for="selFondo">Fondo</label>
        <select id="selFondo">
          <option value="transparente">Transparente</option>
          <option value="blanco">Blanco</option>
          <option value="claro">Gris claro</option>
          <option value="oscuro">Azul oscuro</option>
        </select>
      </div>
      <div>
        <label for="rangoTam">Tamaño de exportación: <span id="lblTam">1600</span> px</label>
        <input type="range" id="rangoTam" min="800" max="3200" step="200" value="1600">
      </div>
      <div class="acciones">
        <button class="btn btn-primario" id="btnPNG">⬇ Descargar PNG</button>
        <button class="btn btn-secundario" id="btnSVG">Descargar SVG</button>
        <button class="btn btn-secundario" id="btnCopiar">Copiar imagen</button>
        <button class="btn btn-secundario" id="btnReset">Restablecer</button>
      </div>
    </div>
  </div>
</div>

<script>
/*BUNDLE*/
</script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const estado = { pestana: 'diagrama', cat: '', esq: '', q: '', actual: null };
  const FONDOS = { transparente: 'transparent', blanco: '#FFFFFF', claro: '#F0F3F7', oscuro: '#122A4D' };
  const textosGuardados = {};

  // filtros
  const selC = $('filtroEsquema');
  ESQUEMAS.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.nombre;
    selC.appendChild(o);
  });

  // pestañas
  $('tabDiagramas').onclick = () => cambiarPestana('diagrama');
  $('tabLogos').onclick = () => cambiarPestana('logo');
  function cambiarPestana(clase) {
    estado.pestana = clase; estado.cat = '';
    $('tabDiagramas').classList.toggle('activo', clase === 'diagrama');
    $('tabLogos').classList.toggle('activo', clase === 'logo');
    pintarChips(); pintar();
  }

  const chips = $('chips');
  function pintarChips() {
    const cats = [''].concat(CATEGORIAS_UNIFICADAS.filter(c => CATALOGO.some(p => p.clase === estado.pestana && p.categoria === c)));
    chips.innerHTML = '';
    cats.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === 0 ? ' activo' : '');
      b.textContent = c === '' ? 'Todas' : c;
      b.onclick = () => {
        estado.cat = c;
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('activo'));
        b.classList.add('activo');
        pintar();
      };
      chips.appendChild(b);
    });
  }

  $('buscador').addEventListener('input', e => { estado.q = e.target.value.toLowerCase().trim(); pintar(); });
  $('filtroEsquema').addEventListener('change', e => { estado.esq = e.target.value; pintar(); });

  function filtrados() {
    return CATALOGO.filter(p => {
      if (p.clase !== estado.pestana) return false;
      if (estado.cat && p.categoria !== estado.cat) return false;
      if (estado.esq && p.esquema !== estado.esq) return false;
      if (estado.q && !(p.nombre + ' ' + p.categoria).toLowerCase().includes(estado.q)) return false;
      return true;
    });
  }

  function pintar() {
    const lista = filtrados();
    $('contador').textContent = lista.length + ' plantilla' + (lista.length === 1 ? '' : 's');
    const grid = $('grid');
    grid.innerHTML = '';
    if (!lista.length) { grid.innerHTML = '<div class="vacio">Sin resultados.</div>'; return; }
    const frag = document.createDocumentFragment();
    lista.slice(0, 60).forEach(p => frag.appendChild(tarjeta(p)));
    grid.appendChild(frag);
  }

  function tarjeta(p) {
    const card = document.createElement('div');
    card.className = 'tarjeta';
    card.innerHTML = '<div class="thumb">' + render(p) + '</div>' +
      '<div class="pie"><strong>' + p.nombre + '</strong><span>' + p.categoria + '</span></div>';
    card.onclick = () => abrir(p);
    return card;
  }

  // ---- Editor ----
  const modal = $('modal');

  function abrir(p) {
    estado.actual = JSON.parse(JSON.stringify(p));
    estado.actual.textos = (textosGuardados[p.id] || []).slice() || undefined;
    if (!estado.actual.textos || !estado.actual.textos.length) estado.actual.textos = undefined;
    $('titEditor').textContent = p.nombre;
    $('subEditor').textContent = p.categoria;
    const esDiagrama = p.clase === 'diagrama';
    $('bloqueTextos').classList.toggle('oculto', !esDiagrama);
    $('bloquePasos').classList.toggle('oculto', !esDiagrama);
    $('bloqueLogo').classList.toggle('oculto', !esDiagrama);
    $('bloqueFondo').classList.toggle('oculto', esDiagrama);
    if (esDiagrama) {
      const selP = $('selPasos');
      selP.innerHTML = '';
      for (let n = 3; n <= 8; n++) {
        const o = document.createElement('option');
        o.value = n; o.textContent = n + ' elementos';
        if (n === p.pasos) o.selected = true;
        selP.appendChild(o);
      }
      const selL = $('selLogo');
      selL.innerHTML = '<option value="">Sin logo</option>';
      CONCEPTOS.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.nombre;
        if (estado.actual.logoConcepto === c.id) o.selected = true;
        selL.appendChild(o);
      });
      pintarTextos();
    }
    pintarSwatches();
    refrescar();
    modal.classList.add('abierto');
  }

  function pintarSwatches() {
    const sw = $('swatches');
    sw.innerHTML = '';
    ESQUEMAS.forEach(e => {
      const d = document.createElement('div');
      d.className = 'swatch' + (e.id === estado.actual.esquema ? ' activo' : '');
      d.style.background = 'linear-gradient(135deg,' + e.primario + ' 50%,' + e.secundario + ' 50%)';
      d.title = e.nombre;
      d.onclick = () => {
        estado.actual.esquema = e.id;
        pintarSwatches(); refrescar();
      };
      sw.appendChild(d);
    });
  }

  function pintarTextos() {
    const cont = $('listaTextos');
    cont.innerHTML = '';
    const textos = estado.actual.textos || textosDefault(estado.actual.pasos);
    textos.forEach((t, i) => {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = t;
      inp.placeholder = 'Elemento ' + (i + 1);
      inp.addEventListener('input', () => {
        if (!estado.actual.textos) estado.actual.textos = textosDefault(estado.actual.pasos);
        estado.actual.textos[i] = inp.value;
        textosGuardados[estado.actual.id] = estado.actual.textos.slice();
        refrescar();
      });
      cont.appendChild(inp);
    });
  }

  function refrescar() {
    $('vista').innerHTML = render(estado.actual);
  }

  $('selPasos').addEventListener('change', e => {
    const n = +e.target.value;
    const base = estado.actual.textos || textosDefault(estado.actual.pasos);
    const def = textosDefault(n);
    const nuevos = [];
    for (let i = 0; i < n; i++) nuevos.push(base[i] !== undefined ? base[i] : def[i]);
    estado.actual.textos = nuevos; estado.actual.pasos = n;
    textosGuardados[estado.actual.id] = nuevos.slice();
    pintarTextos(); refrescar();
  });
  $('selLogo').addEventListener('change', e => {
    estado.actual.logoConcepto = e.target.value || undefined;
    refrescar();
  });
  $('selFondo').addEventListener('change', e => {
    const v = $('vista');
    v.style.background = FONDOS[e.target.value];
  });
  $('rangoTam').addEventListener('input', e => { $('lblTam').textContent = e.target.value; });
  $('btnReset').addEventListener('click', () => {
    delete textosGuardados[estado.actual.id];
    abrir({ ...estado.actual, textos: undefined });
  });
  $('btnCerrar').addEventListener('click', () => modal.classList.remove('abierto'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('abierto'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('abierto')) modal.classList.remove('abierto'); });

  // ---- Exportación ----
  function svgExport() {
    const p = estado.actual;
    const esDiagrama = p.clase === 'diagrama';
    const fondo = FONDOS[$('selFondo').value];
    let svg = render(p);
    if (!esDiagrama && fondo !== 'transparent') {
      svg = svg.replace(/(<\/style>)/, '$1<rect width="512" height="512" fill="' + fondo + '"/>');
    }
    return svg;
  }

  function dims() {
    return estado.actual.clase === 'diagrama' ? [800, 500] : [512, 512];
  }

  function nombreArchivo(ext) { return estado.actual.id + '.' + ext; }

  function descargar(blob, nombre) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  $('btnSVG').addEventListener('click', () => {
    descargar(new Blob([svgExport()], { type: 'image/svg+xml' }), nombreArchivo('svg'));
  });

  function svgABitmap(px) {
    return new Promise((res, rej) => {
      const [w, h] = dims();
      const escala = px / Math.max(w, h);
      const url = URL.createObjectURL(new Blob([svgExport()], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = Math.round(w * escala); c.height = Math.round(h * escala);
        const ctx = c.getContext('2d');
        const fondo = FONDOS[$('selFondo').value];
        if (estado.actual.clase === 'logo' && fondo !== 'transparent') {
          ctx.fillStyle = fondo; ctx.fillRect(0, 0, c.width, c.height);
        } else if (estado.actual.clase === 'diagrama') {
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = rej;
      img.src = url;
    });
  }

  $('btnPNG').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(+$('rangoTam').value);
      c.toBlob(b => descargar(b, nombreArchivo('png')), 'image/png');
    } catch (e) { alert('No se pudo generar el PNG: ' + e.message); }
  });

  $('btnCopiar').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(1600);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      const b = $('btnCopiar'); const t = b.textContent;
      b.textContent = '✓ Copiada';
      setTimeout(() => b.textContent = t, 1600);
    } catch (e) {
      alert('Tu navegador no permite copiar imágenes. Usa «Descargar PNG».');
    }
  });

  pintarChips(); pintar();
})();
</script>
</body>
</html>
