name: Verificar catálogo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar index.html
        run: node scripts/compilar.js
      - name: Verificar 300 plantillas
        run: node scripts/verificar.js
      - name: Verificar motor SmartArt (7 layouts + avisos)
        run: node scripts/verificar-smartart.js
      - name: Verificar bundles de las dos apps
        run: node scripts/verificar-bundle.js
      - name: Compilar la app nueva (motor v2)
        run: node scripts/compilar2.js
      - name: Verificar el motor v2 de forma estática
        run: node scripts/verificar-v2-estatico.js
      - name: Sin referencias externas ni nombres prohibidos
        run: node scripts/verificar-higiene.js
