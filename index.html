<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagramas Ambientales — Catálogo de plantillas</title>
<style>
:root {
  --primario: #1A4488;
  --primario-suave: #3D6AB5;
  --acento: #CB1823;
  --texto: #33404F;
  --medio: #8A94A0;
  --claro: #C9D0D8;
  --fondo: #F4F6F9;
  --blanco: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
}
header {
  background: var(--blanco);
  border-bottom: 1px solid var(--claro);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 50;
}
header .marca { width: 42px; height: 42px; flex: none; }
header h1 { font-size: 20px; font-weight: 700; color: var(--primario); }
header p { font-size: 13px; color: var(--medio); }
main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 8px;
}
#buscador {
  flex: 1 1 260px;
  min-width: 220px;
  padding: 11px 16px;
  border: 1.5px solid var(--claro);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  background: var(--blanco);
}
#buscador:focus { border-color: var(--primario-suave); }
select {
  padding: 10px 14px;
  border: 1.5px solid var(--claro);
  border-radius: 10px;
  font-size: 14px;
  background: var(--blanco);
  color: var(--texto);
  outline: none;
  cursor: pointer;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
.chip {
  padding: 7px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--claro);
  background: var(--blanco);
  font-size: 13px;
  color: var(--texto);
  cursor: pointer;
  transition: all .15s;
}
.chip:hover { border-color: var(--primario-suave); }
.chip.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
#contador { font-size: 13px; color: var(--medio); margin-bottom: 14px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 18px;
}
.tarjeta {
  background: var(--blanco);
  border: 1.5px solid var(--claro);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow .15s, transform .15s, border-color .15s;
}
.tarjeta:hover {
  border-color: var(--primario-suave);
  box-shadow: 0 8px 24px rgba(26,68,136,.12);
  transform: translateY(-2px);
}
.tarjeta .thumb { display: block; width: 100%; }
.tarjeta .thumb svg { display: block; width: 100%; height: auto; }
.tarjeta .pie {
  padding: 10px 14px;
  border-top: 1px solid #EEF1F5;
}
.tarjeta .pie strong { display: block; font-size: 13.5px; font-weight: 600; }
.tarjeta .pie span { font-size: 12px; color: var(--medio); }

/* Modal editor */
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,40,55,.55);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#modal.abierto { display: flex; }
.editor {
  background: var(--blanco);
  border-radius: 18px;
  width: min(1150px, 96vw);
  max-height: 94vh;
  overflow: auto;
  display: grid;
  grid-template-columns: 1.35fr 1fr;
}
@media (max-width: 860px) { .editor { grid-template-columns: 1fr; } }
.editor .vista {
  padding: 22px;
  background: var(--fondo);
  display: flex;
  align-items: center;
  justify-content: center;
}
.editor .vista svg {
  max-width: 100%;
  height: auto;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}
.editor .panel { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.editor h2 { font-size: 18px; color: var(--primario); }
.editor .sub { font-size: 13px; color: var(--medio); }
.editor label { font-size: 12.5px; font-weight: 600; color: var(--texto); display: block; margin-bottom: 4px; }
.editor input[type="text"], .editor select {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--claro);
  border-radius: 9px;
  font-size: 14px;
  outline: none;
}
.editor input[type="text"]:focus { border-color: var(--primario-suave); }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn {
  padding: 11px 18px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn-primario { background: var(--primario); color: #fff; }
.btn-secundario { background: #E8EDF4; color: var(--primario); }
.btn-cerrar {
  background: none;
  border: none;
  font-size: 26px;
  color: var(--medio);
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
  align-self: flex-end;
}
.cabecera-panel { display: flex; justify-content: space-between; align-items: flex-start; }
#listaTextos { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow: auto; }
footer {
  text-align: center;
  padding: 26px;
  font-size: 12.5px;
  color: var(--medio);
}
.vacio { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--medio); }
</style>
</head>
<body>
<header>
  <svg class="marca" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1A4488"/><path d="M24 10c-7 4-10 10-8 17 3 1 7 1 10-1 4-2 6-7 5-11-1-3-4-5-7-5zm-1 6c2 3 3 7 2 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M15 34c6 2 12 2 18 0" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
  <div>
    <h1>Diagramas Ambientales</h1>
    <p>300 plantillas listas para tus informes y presentaciones · edición directa · sin instalar nada</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="buscador" type="text" placeholder="Buscar plantilla… (proceso, ciclo, matriz…)">
    <select id="filtroEsquema"><option value="">Todos los colores</option></select>
    <select id="filtroPasos"><option value="">Cualquier nº de elementos</option><option value="3">3 elementos</option><option value="4">4 elementos</option><option value="5">5 elementos</option><option value="6">6 elementos</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="contador"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Herramienta de diagramación para informes de medio ambiente · funciona sin conexión</footer>

<div id="modal">
  <div class="editor">
    <div class="vista" id="vista"></div>
    <div class="panel">
      <div class="cabecera-panel">
        <div>
          <h2 id="titEditor"></h2>
          <p class="sub" id="subEditor"></p>
        </div>
        <button class="btn-cerrar" id="btnCerrar" title="Cerrar">✕</button>
      </div>
      <div>
        <label for="selEsquema">Esquema de color</label>
        <select id="selEsquema"></select>
      </div>
      <div>
        <label for="selPasos">Número de elementos</label>
        <select id="selPasos"></select>
      </div>
      <div>
        <label>Textos (clic en cada caja para cambiarlos)</label>
        <div id="listaTextos"></div>
      </div>
      <div class="acciones">
        <button class="btn btn-primario" id="btnPNG">⬇ Descargar PNG</button>
        <button class="btn btn-secundario" id="btnSVG">Descargar SVG</button>
        <button class="btn btn-secundario" id="btnCopiar">Copiar imagen</button>
        <button class="btn btn-secundario" id="btnReset">Restablecer textos</button>
      </div>
    </div>
  </div>
</div>

<script>

// ============================================================
// PALETA — Colores derivados del manual de identidad corporativa (azul, rojo, gris) + tintes tonales.
// 10 esquemas × 4 roles: primario / secundario / acento / neutro.
// ============================================================

const ESQUEMAS = [
  { id: 'corporativo', nombre: 'Corporativo',
    primario: '#1A4488', secundario: '#3D6AB5', acento: '#CB1823', neutro: '#57626E' },
  { id: 'azul-pro', nombre: 'Azul profesional',
    primario: '#1A4488', secundario: '#5B84C4', acento: '#8FAE3A', neutro: '#8A94A0' },
  { id: 'verde-eco', nombre: 'Verde sostenible',
    primario: '#2E6E4E', secundario: '#5E9E7E', acento: '#1A4488', neutro: '#6B7A72' },
  { id: 'agua', nombre: 'Azul agua',
    primario: '#1E6091', secundario: '#5FA8D3', acento: '#CB1823', neutro: '#64748B' },
  { id: 'tierra', nombre: 'Tierra y bosque',
    primario: '#5B4A2F', secundario: '#8A7A5A', acento: '#4C7A3D', neutro: '#7D7466' },
  { id: 'energia', nombre: 'Energía limpia',
    primario: '#1A4488', secundario: '#4C7A3D', acento: '#CB1823', neutro: '#57626E' },
  { id: 'atardecer', nombre: 'Atardecer ambiental',
    primario: '#B0532A', secundario: '#D08A56', acento: '#1A4488', neutro: '#8A7462' },
  { id: 'biodiversidad', nombre: 'Biodiversidad',
    primario: '#2C5F2D', secundario: '#97BC62', acento: '#1A4488', neutro: '#71806A' },
  { id: 'oceanico', nombre: 'Oceánico profundo',
    primario: '#0B4F6C', secundario: '#3D8FA8', acento: '#5E9E7E', neutro: '#5F7480' },
  { id: 'monocromo', nombre: 'Monocromo sobrio',
    primario: '#3D4A5C', secundario: '#7B8794', acento: '#1A4488', neutro: '#A6ADB5' },
];

// Grises de apoyo (tonos derivados del neutro corporativo)
const GRISES = {
  oscuro: '#2B3440',
  texto: '#33404F',
  medio: '#8A94A0',
  claro: '#C9D0D8',
  fondo: '#F2F4F7',
  blanco: '#FFFFFF',
};

// Categorías temáticas medioambientales (para filtros del catálogo)
const CATEGORIAS = [
  'Procesos',
  'Ciclos',
  'Comparativas',
  'Jerarquías',
  'Listas y matrices',
  'Relaciones',
  'Líneas de tiempo',
  'Flujos',
];

// 30 tipos de diagrama: cada uno genera SVG con 4..8 elementos,
// textos editables y esquema cromático aplicado.
const TIPOS = [
  { id: 'proceso-flechas', nombre: 'Proceso en flechas', cat: 'Procesos', pasos: 5 },
  { id: 'proceso-chevrons', nombre: 'Chevrones apilados', cat: 'Procesos', pasos: 5 },
  { id: 'proceso-escalera', nombre: 'Escalera ascendente', cat: 'Procesos', pasos: 4 },
  { id: 'proceso-serpiente', nombre: 'Proceso serpiente', cat: 'Procesos', pasos: 6 },
  { id: 'proceso-pilares', nombre: 'Pilares del proceso', cat: 'Procesos', pasos: 4 },
  { id: 'ciclo-4', nombre: 'Ciclo de 4 fases', cat: 'Ciclos', pasos: 4 },
  { id: 'ciclo-6', nombre: 'Ciclo de mejora continua', cat: 'Ciclos', pasos: 6 },
  { id: 'ciclo-segmentos', nombre: 'Ciclo de segmentos', cat: 'Ciclos', pasos: 5 },
  { id: 'ciclo-orbital', nombre: 'Órbita central', cat: 'Ciclos', pasos: 5 },
  { id: 'ciclo-espiral', nombre: 'Espiral de evolución', cat: 'Ciclos', pasos: 5 },
  { id: 'comparativa-2col', nombre: 'Comparativa dos columnas', cat: 'Comparativas', pasos: 4 },
  { id: 'comparativa-vs', nombre: 'Enfrentamiento VS', cat: 'Comparativas', pasos: 4 },
  { id: 'comparativa-bascula', nombre: 'Báscula de decisiones', cat: 'Comparativas', pasos: 4 },
  { id: 'comparativa-solapes', nombre: 'Diagrama de solapes', cat: 'Comparativas', pasos: 3 },
  { id: 'piramide-4', nombre: 'Pirámide de niveles', cat: 'Jerarquías', pasos: 4 },
  { id: 'piramide-invertida', nombre: 'Pirámide invertida', cat: 'Jerarquías', pasos: 4 },
  { id: 'jerarquia-organica', nombre: 'Organigrama ambiental', cat: 'Jerarquías', pasos: 5 },
  { id: 'jerarquia-arbol', nombre: 'Árbol de decisiones', cat: 'Jerarquías', pasos: 6 },
  { id: 'lista-vertical', nombre: 'Lista vertical numerada', cat: 'Listas y matrices', pasos: 6 },
  { id: 'lista-tarjetas', nombre: 'Tarjetas en cuadrícula', cat: 'Listas y matrices', pasos: 6 },
  { id: 'lista-checklist', nombre: 'Lista de verificación', cat: 'Listas y matrices', pasos: 5 },
  { id: 'matriz-2x2', nombre: 'Matriz 2×2', cat: 'Listas y matrices', pasos: 4 },
  { id: 'matriz-eisenhower', nombre: 'Matriz de prioridades', cat: 'Listas y matrices', pasos: 4 },
  { id: 'relacion-radial', nombre: 'Radial central', cat: 'Relaciones', pasos: 6 },
  { id: 'relacion-convergente', nombre: 'Convergencia a objetivo', cat: 'Relaciones', pasos: 5 },
  { id: 'relacion-venn-3', nombre: 'Triple intersección', cat: 'Relaciones', pasos: 3 },
  { id: 'tiempo-lineal', nombre: 'Línea de tiempo', cat: 'Líneas de tiempo', pasos: 6 },
  { id: 'tiempo-hitos', nombre: 'Hitos alternados', cat: 'Líneas de tiempo', pasos: 6 },
  { id: 'flujo-decision', nombre: 'Flujo con decisión', cat: 'Flujos', pasos: 5 },
  { id: 'flujo-embudo', nombre: 'Embudo de fases', cat: 'Flujos', pasos: 5 },
];

// Nombres por defecto de los pasos (editables en la UI)
const TEXTOS_DEFAULT = [
  'Identificación', 'Análisis', 'Diagnóstico', 'Planificación',
  'Implantación', 'Seguimiento', 'Evaluación', 'Mejora continua',
];

function textosDefault(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(TEXTOS_DEFAULT[i % TEXTOS_DEFAULT.length]);
  return out;
}

// Tinte del color base: mezcla hacia blanco (t>0) o hacia negro (t<0)
function tinte(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const destino = t >= 0 ? 255 : 0;
  const f = Math.abs(t);
  r = Math.round(r + (destino - r) * f);
  g = Math.round(g + (destino - g) * f);
  b = Math.round(b + (destino - b) * f);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function escapar(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textoSVG(x, y, txt, opts = {}) {
  const { size = 14, peso = 600, color = '#33404F', ancla = 'middle', maxAncho = 140, lineas = null } = opts;
  const parts = [];
  const contenido = lineas || partirTexto(txt, maxAncho, size);
  const altoLinea = size * 1.25;
  const y0 = y - ((contenido.length - 1) * altoLinea) / 2;
  parts.push(`<text x="${x}" y="${y0}" text-anchor="${ancla}" font-family="'Segoe UI', Arial, sans-serif" font-size="${size}" font-weight="${peso}" fill="${color}">`);
  contenido.forEach((l, i) => parts.push(`<tspan x="${x}" dy="${i === 0 ? 0 : altoLinea}">${escapar(l)}</tspan>`));
  parts.push('</text>');
  return parts.join('');
}

function partirTexto(txt, maxAncho, size) {
  const caracteres = Math.max(6, Math.floor(maxAncho / (size * 0.56)));
  const palabras = String(txt).split(/\s+/);
  const lineas = [];
  let actual = '';
  for (const p of palabras) {
    if ((actual + ' ' + p).trim().length <= caracteres) {
      actual = (actual + ' ' + p).trim();
    } else {
      if (actual) lineas.push(actual);
      actual = p;
    }
  }
  if (actual) lineas.push(actual);
  return lineas.slice(0, 3); // máximo 3 líneas por caja
}



// ============================================================
// GENERADORES SVG — 30 tipos de diagrama.
// Cada generador recibe { esquema, textos } y devuelve un SVG
// string con viewBox 800x500, textos reales (editables) y
// data-attrs para la edición en la UI.
// ============================================================



function fondo() {
  return `<rect width="800" height="500" fill="#FFFFFF"/>`;
}

function caja(x, y, w, h, fill, rx = 10, stroke = null) {
  const s = stroke ? ` stroke="${stroke}" stroke-width="2"` : '';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}"${s}/>`;
}

function flecha(x1, y1, x2, y2, color, ancho = 3) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${ancho}" marker-end="url(#punta)"/>`;
}

function defs() {
  return `<defs><marker id="punta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A94A0"/></marker></defs>`;
}

const G = {};

// ---------- PROCESOS ----------

G['proceso-flechas'] = (e, t) => {
  const n = t.length, w = 128, h = 90, gap = (800 - n * w) / (n + 1);
  let s = fondo() + defs();
  t.forEach((txt, i) => {
    const x = gap + i * (w + gap), y = 205;
    const col = i % 2 === 0 ? e.primario : e.secundario;
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 12)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', maxAncho: w - 16 })}</g>`;
    if (i < n - 1) s += flecha(x + w + 4, y + h / 2, x + w + gap - 4, y + h / 2, GRISES.medio);
  });
  return s + '</svg>';
};

G['proceso-chevrons'] = (e, t) => {
  const n = t.length, w = 150, h = 320, solape = 20;
  const total = n * w - (n - 1) * solape, x0 = (800 - total) / 2;
  let s = fondo();
  t.forEach((txt, i) => {
    const x = x0 + i * (w - solape);
    const col = tinte(i % 2 === 0 ? e.primario : e.secundario, -i * 0.06);
    const punta = i < n - 1 ? 24 : 0;
    s += `<g data-i="${i}"><path d="M${x},90 L${x + w - punta},90 L${x + w},250 L${x + w - punta},410 L${x},410 L${x + (i > 0 ? 24 : 0)},250 Z" fill="${col}"/>`;
    s += textoSVG(x + w / 2 + (i > 0 ? 12 : 0), 250, txt, { color: '#fff', size: 15, maxAncho: w - 50 }) + '</g>';
  });
  return s + '</svg>';
};

G['proceso-escalera'] = (e, t) => {
  const n = t.length, w = 150, h = 74, paso = Math.min(90, 330 / (n - 1));
  let s = fondo() + defs();
  t.forEach((txt, i) => {
    const x = 60 + i * (w + 28), y = 380 - i * paso;
    const col = tinte(e.primario, i * 0.1);
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 10)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', maxAncho: w - 14 })}</g>`;
    if (i < n - 1) s += flecha(x + w + 2, y - 6, x + w + 26, y - paso + h + 6, GRISES.medio);
  });
  return s + '</svg>';
};

G['proceso-serpiente'] = (e, t) => {
  const n = t.length, w = 170, h = 80;
  const porFila = Math.ceil(n / 2);
  const gap = Math.min(40, (800 - 80 - porFila * w) / Math.max(1, porFila - 1));
  let s = fondo() + defs();
  t.forEach((txt, i) => {
    const fila = Math.floor(i / porFila), idx = i % porFila;
    const izq = fila % 2 === 0;
    const col = idxInFila => idxInFila % 2 === 0 ? e.primario : e.secundario;
    const x = izq ? 40 + idx * (w + gap) : 40 + (porFila - 1 - idx) * (w + gap);
    const y = fila === 0 ? 120 : 300;
    s += `<g data-i="${i}">${caja(x, y, w, h, col(idx), 12)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', maxAncho: w - 16 })}</g>`;
  });
  // flechas serpiente
  for (let i = 0; i < n - 1; i++) {
    const fila = Math.floor(i / porFila), idx = i % porFila;
    const izq = fila % 2 === 0;
    const x = izq ? 40 + idx * (w + gap) : 40 + (porFila - 1 - idx) * (w + gap);
    const y = fila === 0 ? 120 : 300;
    if (idx < porFila - 1) {
      const sigIzq = izq;
      const xs = sigIzq ? x + w + 4 : x - 4;
      const xe = sigIzq ? x + w + gap - 4 : x - gap + 4;
      s += flecha(xs, y + h / 2, xe, y + h / 2, GRISES.medio);
    } else {
      s += flecha(x + w / 2, y + h + 4, x + w / 2, y + 160 - 4, GRISES.medio);
    }
  }
  return s + '</svg>';
};

G['proceso-pilares'] = (e, t) => {
  const n = t.length, w = 140, gap = (800 - 60 - n * w) / (n + 1);
  let s = fondo();
  t.forEach((txt, i) => {
    const x = 60 + gap + i * (w + gap);
    const col = tinte(e.primario, i * 0.08);
    const h = 200 + (i % 3) * 30, y = 400 - h;
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 8)}${textoSVG(x + w / 2, y + 30, `${i + 1}. ${txt}`, { color: '#fff', size: 14, maxAncho: w - 14 })}</g>`;
  });
  return s + '</svg>';
};

// ---------- CICLOS ----------

function cicloCircular(e, t, anguloIni = -90) {
  const cx = 400, cy = 250, rCaja = 165, w = 150, h = 64;
  let s = fondo() + defs();

    const col = i % 2 === 0 ? e.primario : e.acento;
    const arriba = i % 2 === 0;
    s += `<polygon points="${x},${arriba ? 235 : 265} ${x - 9},${arriba ? 250 : 250} ${x + 9},${arriba ? 250 : 250}" fill="${col}"/>`;
    s += `<circle cx="${x}" cy="250" r="7" fill="#fff" stroke="${col}" stroke-width="3"/>`;
    const yCaja = arriba ? 120 : 300;
    s += `<g data-i="${i}">${caja(x - 58, yCaja, 116, 70, '#fff', 10, col)}${textoSVG(x, yCaja + 35, txt, { color: GRISES.texto, size: 12, maxAncho: 100 })}</g>`;
  });
  return s + '</svg>';
};

// ---------- FLUJOS ----------

G['flujo-decision'] = (e, t) => {
  let s = fondo() + defs();
  s += `<g data-i="0">${caja(310, 40, 180, 60, e.primario, 10)}${textoSVG(400, 70, t[0], { color: '#fff', maxAncho: 160 })}</g>`;
  s += `<line x1="400" y1="100" x2="400" y2="140" stroke="${GRISES.medio}" stroke-width="2.5" marker-end="url(#punta)"/>`;
  s += `<g data-i="1"><polygon points="400,145 520,210 400,275 280,210" fill="${e.acento}"/>${textoSVG(400, 210, t[1], { color: '#fff', size: 13, maxAncho: 180 })}</g>`;
  const ramas = [['Sí', t.slice(2, Math.ceil((t.length - 2) / 2) + 2), 130], ['No', t.slice(Math.ceil((t.length - 2) / 2) + 2), 670]];
  ramas.forEach(([lab, items, x], r) => {
    if (!items.length) return;
    const col = r === 0 ? e.secundario : e.neutro;
    s += `<line x1="${r === 0 ? 280 : 520}" y1="210" x2="${x}" y2="210" stroke="${GRISES.medio}" stroke-width="2.5" marker-end="url(#punta)"/>`;
    s += textoSVG((r === 0 ? 280 : 520) + (r === 0 ? 30 : -30), 195, lab, { color: GRISES.medio, size: 13, peso: 700 });
    items.forEach((txt, i) => {
      const y = 140 + i * 100;
      s += `<g data-i="${2 + (r === 0 ? i : ramas[0][1].length + i)}">${caja(x - 75, y, 150, 70, col, 10)}${textoSVG(x, y + 35, txt, { color: '#fff', size: 12, maxAncho: 134 })}</g>`;
      if (i < items.length - 1) s += `<line x1="${x}" y1="${y + 70}" x2="${x}" y2="${y + 100}" stroke="${GRISES.medio}" stroke-width="2" marker-end="url(#punta)"/>`;
    });
  });
  return s + '</svg>';
};

G['flujo-embudo'] = (e, t) => {
  let s = fondo();
  const n = t.length, h = 62, gap = 14;
  const y0 = 70, Wmax = 560, Wmin = 160;
  t.forEach((txt, i) => {
    const y = y0 + i * (h + gap);
    const w1 = Wmax - ((Wmax - Wmin) / n) * i;
    const w2 = Wmax - ((Wmax - Wmin) / n) * (i + 1);
    const col = tinte(e.primario, i * 0.09);
    s += `<g data-i="${i}"><polygon points="${400 - w1 / 2},${y} ${400 + w1 / 2},${y} ${400 + w2 / 2},${y + h} ${400 - w2 / 2},${y + h}" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    s += textoSVG(400, y + h / 2 + 5, `${i + 1}. ${txt}`, { color: '#fff', size: 14, maxAncho: w2 - 40 }) + '</g>';
  });
  return s + '</svg>';
};



// ============================================================
// ÍNDICE DEL CATÁLOGO — 30 tipos × 10 esquemas = 300 plantillas
// ============================================================

const CATALOGO = [];
for (const tipo of TIPOS) {
  for (const esq of ESQUEMAS) {
    CATALOGO.push({
      id: `${tipo.id}__${esq.id}`,
      tipo: tipo.id,
      nombreTipo: tipo.nombre,
      categoria: tipo.cat,
      esquema: esq.id,
      nombreEsquema: esq.nombre,
      pasos: tipo.pasos,
      textos: textosDefault(tipo.pasos),
    });
  }
}




const MINIMOS = { 'relacion-venn-3': 3, 'comparativa-solapes': 3, 'comparativa-2col': 4, 'matriz-2x2': 4, 'matriz-eisenhower': 4, 'ciclo-4': 4, 'piramide-4': 4, 'piramide-invertida': 4 };
const MAXIMOS = { 'relacion-venn-3': 3, 'comparativa-solapes': 3, 'comparativa-2col': 8, 'matriz-2x2': 4, 'matriz-eisenhower': 4, 'ciclo-4': 6, 'ciclo-6': 8, 'piramide-4': 6, 'piramide-invertida': 6 };
function render(p) {
  const esq = ESQUEMAS.find(e => e.id === p.esquema);
  const gen = G[p.tipo];
  if (!esq) throw new Error('Esquema desconocido: ' + p.esquema);
  if (!gen) throw new Error('Generador desconocido: ' + p.tipo);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">' + gen(esq, p.textos);
}

</script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  let estado = {
    filtroCat: '',
    filtroEsq: '',
    filtroPasos: '',
    q: '',
    actual: null, // plantilla abierta
  };
  const textosEditados = {}; // idPlantilla -> [textos]

  // ---- Población de filtros ----
  const selEsqFiltro = $('filtroEsquema');
  ESQUEMAS.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.nombre;
    selEsqFiltro.appendChild(o);
  });

  const chips = $('chips');
  const cats = [''].concat(CATEGORIAS);
  cats.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' activo' : '');
    b.textContent = c === '' ? 'Todas' : c;
    b.onclick = () => {
      estado.filtroCat = c;
      chips.querySelectorAll('.chip').forEach(x => x.classList.remove('activo'));
      b.classList.add('activo');
      pintar();
    };
    chips.appendChild(b);
  });

  $('buscador').addEventListener('input', e => { estado.q = e.target.value.toLowerCase().trim(); pintar(); });
  $('filtroEsquema').addEventListener('change', e => { estado.filtroEsq = e.target.value; pintar(); });
  $('filtroPasos').addEventListener('change', e => { estado.filtroPasos = e.target.value; pintar(); });

  function plantillaFiltrada() {
    return CATALOGO.filter(p => {
      if (estado.filtroCat && p.categoria !== estado.filtroCat) return false;
      if (estado.filtroEsq && p.esquema !== estado.filtroEsq) return false;
      if (estado.filtroPasos && p.pasos !== +estado.filtroPasos) return false;
      if (estado.q && !(p.nombreTipo + ' ' + p.nombreEsquema + ' ' + p.categoria).toLowerCase().includes(estado.q)) return false;
      return true;
    });
  }

  function textosDe(p) {
    return textosEditados[p.id] || p.textos;
  }

  function svgDe(p, textos) {
    return render({ ...p, textos });
  }

  function pintar() {
    const lista = plantillaFiltrada();
    $('contador').textContent = lista.length + ' plantilla' + (lista.length === 1 ? '' : 's');
    const grid = $('grid');
    grid.innerHTML = '';
    if (!lista.length) {
      grid.innerHTML = '<div class="vacio">Sin resultados. Prueba con otra búsqueda.</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    lista.forEach(p => {
      const card = document.createElement('div');
      card.className = 'tarjeta';
      card.innerHTML = `<div class="thumb">${svgDe(p, textosDe(p))}</div>
        <div class="pie"><strong>${p.nombreTipo}</strong><span>${p.nombreEsquema} · ${p.categoria}</span></div>`;
      card.onclick = () => abrir(p);
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  // ---- Editor ----
  const modal = $('modal');

  function abrir(p) {
    estado.actual = { ...p, textos: textosDe(p).slice() };
    $('titEditor').textContent = p.nombreTipo;
    $('subEditor').textContent = p.nombreEsquema + ' · ' + p.categoria;
    const selE = $('selEsquema');
    selE.innerHTML = '';
    ESQUEMAS.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id; o.textContent = e.nombre;
      if (e.id === p.esquema) o.selected = true;
      selE.appendChild(o);
    });
    const selP = $('selPasos');
    selP.innerHTML = '';
    const min = MINIMOS[p.tipo] || 3, max = MAXIMOS[p.tipo] || 8;
    for (let n = min; n <= max; n++) {
      const o = document.createElement('option');
      o.value = n; o.textContent = n + ' elementos';
      if (n === p.pasos) o.selected = true;
      selP.appendChild(o);
    }
    pintarTextos();
    refrescar();
    modal.classList.add('abierto');
  }

  function pintarTextos() {
    const cont = $('listaTextos');
    cont.innerHTML = '';
    estado.actual.textos.forEach((t, i) => {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = t;
      inp.placeholder = 'Elemento ' + (i + 1);
      inp.addEventListener('input', () => {
        estado.actual.textos[i] = inp.value;
        textosEditados[clave()] = estado.actual.textos.slice();
        refrescar();
      });
      cont.appendChild(inp);
    });
  }

  function clave() {
    const a = estado.actual;
    return a.tipo + '__' + a.esquema;
  }

  function refrescar() {
    const a = estado.actual;
    $('vista').innerHTML = render(a);
  }

  $('selEsquema').addEventListener('change', e => {
    estado.actual.esquema = e.target.value;
    textosEditados[clave()] = textosEditados[clave()] || estado.actual.textos.slice();
    refrescar();
  });
  $('selPasos').addEventListener('change', e => {
    const n = +e.target.value;
    const base = textosEditados[clave()] || estado.actual.textos;
    const def = textosDefault(n);
    const nuevos = [];
    for (let i = 0; i < n; i++) nuevos.push(base[i] !== undefined ? base[i] : def[i]);
    estado.actual.textos = nuevos;
    estado.actual.pasos = n;
    textosEditados[clave()] = nuevos.slice();
    pintarTextos();
    refrescar();
  });
  $('btnReset').addEventListener('click', () => {
    estado.actual.textos = textosDefault(estado.actual.pasos);
    delete textosEditados[clave()];
    pintarTextos();
    refrescar();
  });
  $('btnCerrar').addEventListener('click', () => { modal.classList.remove('abierto'); pintar(); });
  modal.addEventListener('click', e => { if (e.target === modal) { modal.classList.remove('abierto'); pintar(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('abierto')) { modal.classList.remove('abierto'); pintar(); } });

  // ---- Exportación ----
  function svgSerializado() {
    return render(estado.actual);
  }

  function nombreArchivo(ext) {
    return estado.actual.tipo + '-' + estado.actual.esquema + '.' + ext;
  }

  function descargar(blob, nombre) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  $('btnSVG').addEventListener('click', () => {
    descargar(new Blob([svgSerializado()], { type: 'image/svg+xml' }), nombreArchivo('svg'));
  });

  function svgABitmap(escala) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(new Blob([svgSerializado()], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 800 * escala; c.height = 500 * escala;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = rej;
      img.src = url;
    });
  }

  $('btnPNG').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(3);
      c.toBlob(b => descargar(b, nombreArchivo('png')), 'image/png');
    } catch (e) { alert('No se pudo generar el PNG: ' + e.message); }
  });

  $('btnCopiar').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(3);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      const b = $('btnCopiar');
      const t = b.textContent;
      b.textContent = '✓ Copiada';
      setTimeout(() => b.textContent = t, 1600);
    } catch (e) {
      alert('Tu navegador no permite copiar imágenes. Usa «Descargar PNG» e insértala en Word con Insertar → Imagen.');
    }
  });

  pintar();
})();
</script>
</body>
</html>
