<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logos Ambientales — Catálogo de 300 logotipos</title>
<style>
:root {
  --primario: #1A4488;
  --acento: #CB1823;
  --texto: #33404F;
  --medio: #8A94A0;
  --claro: #C9D0D8;
  --fondo: #F4F6F9;
  --blanco: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
}
header {
  background: var(--blanco);
  border-bottom: 1px solid var(--claro);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 50;
}
header .marca { width: 42px; height: 42px; flex: none; }
header h1 { font-size: 20px; font-weight: 700; color: var(--primario); }
header p { font-size: 13px; color: var(--medio); }
main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
#buscador {
  flex: 1 1 260px; min-width: 220px;
  padding: 11px 16px; border: 1.5px solid var(--claro); border-radius: 10px;
  font-size: 15px; outline: none; background: var(--blanco);
}
#buscador:focus { border-color: var(--primario); }
select {
  padding: 10px 14px; border: 1.5px solid var(--claro); border-radius: 10px;
  font-size: 14px; background: var(--blanco); color: var(--texto); outline: none; cursor: pointer;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
.chip {
  padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--claro);
  background: var(--blanco); font-size: 13px; color: var(--texto); cursor: pointer; transition: all .15s;
}
.chip:hover { border-color: var(--primario); }
.chip.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
#contador { font-size: 13px; color: var(--medio); margin-bottom: 14px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}
.tarjeta {
  background: var(--blanco); border: 1.5px solid var(--claro); border-radius: 14px;
  overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s;
}
.tarjeta:hover {
  border-color: var(--primario);
  box-shadow: 0 8px 24px rgba(26,68,136,.14);
  transform: translateY(-2px);
}
.tarjeta .thumb { display: flex; align-items: center; justify-content: center; padding: 10px; }
.tarjeta .thumb svg { width: 100%; height: auto; }
.tarjeta .pie { padding: 10px 14px; border-top: 1px solid #EEF1F5; }
.tarjeta .pie strong { display: block; font-size: 13.5px; font-weight: 600; }
.tarjeta .pie span { font-size: 12px; color: var(--medio); }

#modal {
  display: none; position: fixed; inset: 0;
  background: rgba(30,40,55,.55); z-index: 100;
  align-items: center; justify-content: center; padding: 20px;
}
#modal.abierto { display: flex; }
.editor {
  background: var(--blanco); border-radius: 18px;
  width: min(1000px, 96vw); max-height: 94vh; overflow: auto;
  display: grid; grid-template-columns: 1.2fr 1fr;
}
@media (max-width: 860px) { .editor { grid-template-columns: 1fr; } }
.editor .vista {
  padding: 26px; display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}
.editor .vista svg { max-width: 100%; height: auto; border-radius: 8px; }
.editor .panel { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.editor h2 { font-size: 18px; color: var(--primario); }
.editor .sub { font-size: 13px; color: var(--medio); }
.editor label { font-size: 12.5px; font-weight: 600; display: block; margin-bottom: 5px; }
.editor select, .editor input[type="range"] { width: 100%; }
.editor select { padding: 9px 12px; border: 1.5px solid var(--claro); border-radius: 9px; font-size: 14px; outline: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid transparent; transition: transform .12s;
}
.swatch:hover { transform: scale(1.12); }
.swatch.activo { border-color: var(--texto); }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn {
  padding: 11px 18px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn-primario { background: var(--primario); color: #fff; }
.btn-secundario { background: #E8EDF4; color: var(--primario); }
.btn-cerrar {
  background: none; border: none; font-size: 26px; color: var(--medio);
  cursor: pointer; line-height: 1; padding: 4px 8px; align-self: flex-end;
}
.cabecera-panel { display: flex; justify-content: space-between; align-items: flex-start; }
footer { text-align: center; padding: 26px; font-size: 12.5px; color: var(--medio); }
.vacio { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--medio); }
</style>
</head>
<body>
<header>
  <svg class="marca" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1A4488"/><path d="M24 10c-7 4-10 10-8 17 3 1 7 1 10-1 4-2 6-7 5-11-1-3-4-5-7-5zm-1 6c2 3 3 7 2 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M15 34c6 2 12 2 18 0" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
  <div>
    <h1>Logos Ambientales</h1>
    <p>300 logotipos vectoriales · 5 estilos · 10 paletas de color · descarga en PNG o SVG</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="buscador" type="text" placeholder="Buscar logo… (árbol, agua, energía…)">
    <select id="filtroEstilo"><option value="">Todos los estilos</option></select>
    <select id="filtroEsquema"><option value="">Todos los colores</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="contador"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Catálogo de logotipos para proyectos de medio ambiente · funciona sin conexión · sin recoger ningún dato</footer>

<div id="modal">
  <div class="editor">
    <div class="vista" id="vista"></div>
    <div class="panel">
      <div class="cabecera-panel">
        <div>
          <h2 id="titEditor"></h2>
          <p class="sub" id="subEditor"></p>
        </div>
        <button class="btn-cerrar" id="btnCerrar" title="Cerrar">✕</button>
      </div>
      <div>
        <label>Color del logo</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div>
        <label for="selFondo">Fondo</label>
        <select id="selFondo">
          <option value="transparente">Transparente</option>
          <option value="blanco">Blanco</option>
          <option value="claro">Gris claro</option>
          <option value="oscuro">Azul oscuro</option>
        </select>
      </div>
      <div>
        <label for="rangoTam">Tamaño de exportación: <span id="lblTam">1024</span> px</label>
        <input type="range" id="rangoTam" min="256" max="2048" step="256" value="1024">
      </div>
      <div class="acciones">
        <button class="btn btn-primario" id="btnPNG">⬇ Descargar PNG</button>
        <button class="btn btn-secundario" id="btnSVG">Descargar SVG</button>
        <button class="btn btn-secundario" id="btnCopiar">Copiar imagen</button>
      </div>
      <p class="sub" id="notaExport"></p>
    </div>
  </div>
</div>

<script>

// ============================================================
// PALETA — Esquemas de color derivados del manual de identidad
// corporativa (azul, rojo, gris) + variantes ambientales.
// Cada esquema aporta 4 roles: primario / secundario / acento / neutro.
// ============================================================

const ESQUEMAS = [
  { id: 'corporativo', nombre: 'Corporativo',
    primario: '#1A4488', secundario: '#3D6AB5', acento: '#CB1823', neutro: '#57626E' },
  { id: 'azul-pro', nombre: 'Azul profesional',
    primario: '#1A4488', secundario: '#5B84C4', acento: '#8FAE3A', neutro: '#8A94A0' },
  { id: 'verde-eco', nombre: 'Verde sostenible',
    primario: '#2E6E4E', secundario: '#5E9E7E', acento: '#1A4488', neutro: '#6B7A72' },
  { id: 'agua', nombre: 'Azul agua',
    primario: '#1E6091', secundario: '#5FA8D3', acento: '#CB1823', neutro: '#64748B' },
  { id: 'tierra', nombre: 'Tierra y bosque',
    primario: '#5B4A2F', secundario: '#8A7A5A', acento: '#4C7A3D', neutro: '#7D7466' },
  { id: 'energia', nombre: 'Energía limpia',
    primario: '#1A4488', secundario: '#4C7A3D', acento: '#CB1823', neutro: '#57626E' },
  { id: 'atardecer', nombre: 'Atardecer ambiental',
    primario: '#B0532A', secundario: '#D08A56', acento: '#1A4488', neutro: '#8A7462' },
  { id: 'biodiversidad', nombre: 'Biodiversidad',
    primario: '#2C5F2D', secundario: '#97BC62', acento: '#1A4488', neutro: '#71806A' },
  { id: 'oceanico', nombre: 'Oceánico profundo',
    primario: '#0B4F6C', secundario: '#3D8FA8', acento: '#5E9E7E', neutro: '#5F7480' },
  { id: 'monocromo', nombre: 'Monocromo sobrio',
    primario: '#3D4A5C', secundario: '#7B8794', acento: '#1A4488', neutro: '#A6ADB5' },
];

// Mezcla el color hacia blanco (t>0) o negro (t<0)
function tinte(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const destino = t >= 0 ? 255 : 0;
  const f = Math.abs(t);
  r = Math.round(r + (destino - r) * f);
  g = Math.round(g + (destino - g) * f);
  b = Math.round(b + (destino - b) * f);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}



// ============================================================
// GENERADORES DE LOGOS — 30 conceptos ambientales en SVG 512×512.
// Cada generador: (esquema, variante, uid) → cuerpo SVG.
// Colores por CLASES (.c1..c4 relleno, .st1..st4 trazo, .f blanco)
// para que el estilo (plano/línea/duotono/degradado/insignia)
// se aplique desde catálogo.js sin tocar el dibujo.
// ============================================================

const G = {};

// 1. Árbol copudo
G['arbol'] = (e, v, uid) => {
  let s = '';
  if (v === 1) s += `<circle cx="330" cy="180" r="60" class="c2"/>`;
  s += `<rect x="242" y="270" width="28" height="110" rx="10" class="c4"/>`;
  s += `<circle cx="256" cy="200" r="95" class="c1"/>`;
  s += `<circle cx="200" cy="250" r="55" class="c2"/>`;
  s += `<circle cx="315" cy="245" r="52" class="c2"/>`;
  s += `<circle cx="310" cy="160" r="16" class="c3"/>`;
  s += `<path d="M130 392 Q256 366 382 392" class="st4" stroke-width="12"/>`;
  return s;
};

// 2. Pino
G['pino'] = (e, v, uid) => {
  let s = `<polygon points="256,86 168,214 344,214" class="c1"/>
  <polygon points="256,150 148,296 364,296" class="c1"/>
  <polygon points="256,216 128,384 384,384" class="c2"/>
  <rect x="240" y="378" width="32" height="56" rx="8" class="c4"/>`;
  if (v === 1) s += `<circle cx="404" cy="120" r="26" class="c3"/>`;
  return s;
};

// 3. Hoja
G['hoja'] = (e, v, uid) => {
  let s = `<path d="M256 108 C168 152 152 288 256 404 C360 288 344 152 256 108 Z" class="c1"/>
  <path d="M256 140 L256 380" class="fw" stroke-width="8"/>
  <path d="M256 210 L320 176 M256 270 L318 238 M256 210 L192 176 M256 270 L194 238" class="fw" stroke-width="6"/>`;
  if (v === 1) s += `<circle cx="392" cy="120" r="24" class="c3"/>`;
  return s;
};

// 4. Montaña
G['montana'] = (e, v, uid) => {
  let s = `<polygon points="84,368 206,182 328,368" class="c2"/>
  <polygon points="204,368 328,150 452,368" class="c1"/>
  <polygon points="304,182 328,150 352,182 336,196 316,182" class="f"/>
  <circle cx="118" cy="132" r="34" class="c3"/>
  <path d="M64 368 L448 368" class="st4" stroke-width="12"/>`;
  if (v === 1) { s = s.replace('circle cx="118" cy="132" r="34" class="c3"', 'path d="M118 108 A30 30 0 1 0 148 146 A38 38 0 0 1 118 108 Z" class="c3"'); }
  return s;
};

// 5. Carretera
G['carretera'] = (e, v, uid) => {
  let s = `<polygon points="196,84 316,84 448,428 64,428" class="c4"/>
  <path d="M256 128 L256 412" class="fw" stroke-width="14" stroke-dasharray="34 30"/>
  <polygon points="128,84 156,84 148,116 136,116" class="c3"/>
  <polygon points="356,84 384,84 376,116 364,116" class="c3"/>
  <circle cx="76" cy="60" r="24" class="c3" opacity="0.001"/>`;
  if (v === 1) s = s.replace('opacity="0.001"', '') + `<path d="M64 428 L448 428" class="st2" stroke-width="10"/>`;
  return s;
};

// 6. Camino serpenteante
G['camino'] = (e, v, uid) => {
  let s = `<path d="M120 436 C120 330 392 350 392 252 C392 158 130 180 150 76" class="st4" stroke-width="52"/>
  <path d="M120 436 C120 330 392 350 392 252 C392 158 130 180 150 76" class="fw" stroke-width="9" stroke-dasharray="22 20"/>
  <circle cx="418" cy="90" r="30" class="c3"/>`;
  if (v === 1) s += `<circle cx="86" cy="120" r="22" class="c2"/>`;
  return s;
};

// 7. Puente
G['puente'] = (e, v, uid) => {
  let s = `<path d="M112 262 Q256 116 400 262" class="st1" stroke-width="18"/>
  <rect x="84" y="252" width="344" height="20" rx="10" class="c1"/>
  <path d="M176 258 L176 216 M256 208 L256 216 M336 258 L336 216" class="st1" stroke-width="9"/>
  <path d="M120 330 q22 -18 44 0 t44 0 t44 0 t44 0 t44 0" class="st2" stroke-width="10"/>
  <path d="M150 372 q22 -18 44 0 t44 0 t44 0 t44 0" class="st2" stroke-width="10"/>`;
  if (v === 1) s += `<circle cx="404" cy="120" r="24" class="c3"/>`;
  return s;
};

// 8. Aerogenerador
G['turbina'] = (e, v, uid) => {
  let s = `<polygon points="248,248 264,248 274,428 238,428" class="c4"/>
  <g class="c2"><path d="M256 234 L263 104 L249 104 Z"/><path d="M256 234 L263 104 L249 104 Z" transform="rotate(120 256 240)"/><path d="M256 234 L263 104 L249 104 Z" transform="rotate(240 256 240)"/></g>
  <circle cx="256" cy="240" r="16" class="c1"/>
  <path d="M128 428 L384 428" class="st4" stroke-width="12"/>`;
  if (v === 1) s += `<g transform="translate(120 -40) scale(0.55)"><polygon points="248,248 264,248 274,428 238,428" class="c4"/><g class="c2"><path d="M256 234 L263 104 L249 104 Z"/><path d="M256 234 L263 104 L249 104 Z" transform="rotate(120 256 240)"/><path d="M256 234 L263 104 L249 104 Z" transform="rotate(240 256 240)"/></g><circle cx="256" cy="240" r="16" class="c1"/></g>`;
  return s;
};

// 9. Panel solar
G['panel-solar'] = (e, v, uid) => {
  let s = `<polygon points="130,280 306,280 348,384 88,384" class="c1"/>
  <path d="M187 280 L172 384 M249 280 L249 384 M293 280 L330 384 M109 332 L327 332" class="fw" stroke-width="6"/>
  <path d="M218 384 L218 424" class="st4" stroke-width="12"/>
  <circle cx="392" cy="140" r="38" class="c3"/>
  <path d="M392 76 L392 58 M442 96 L456 82 M448 140 L468 140 M442 184 L456 198" class="st3" stroke-width="9"/>`;
  if (v === 1) s = s.replace('392 76 L392 58 M442 96 L456 82 M448 140 L468 140 M442 184 L456 198', '');
  return s;
};

// 10. Gota
G['gota'] = (e, v, uid) => {
  let s = `<path d="M256 88 C204 184 152 244 152 316 a104 104 0 0 0 208 0 C360 244 308 184 256 88 Z" class="c1"/>
  <path d="M256 196 C226 248 208 274 208 310 a48 48 0 0 0 96 0 C304 274 286 248 256 196 Z" class="c2"/>`;
  if (v === 1) s += `<path d="M392 140 C366 166 352 186 352 208 a40 40 0 0 0 80 0 C432 186 418 166 392 140 Z" class="c3"/>`;
  return s;
};

// 11. Olas
G['olas'] = (e, v, uid) => {
  const sol = v === 1 ? '' : `<circle cx="400" cy="118" r="30" class="c3"/>\n  `;
  return `${sol}<path d="M64 210 q32 -34 64 0 t64 0 t64 0 t64 0 t64 0" class="st2" stroke-width="18"/>
  <path d="M64 290 q32 -34 64 0 t64 0 t64 0 t64 0 t64 0" class="st1" stroke-width="18"/>
  <path d="M64 370 q32 -34 64 0 t64 0 t64 0 t64 0 t64 0" class="st2" stroke-width="18"/>`;
};

// 12. Reciclaje
G['reciclaje'] = (e, v, uid) => {
  // cada segmento: arco de 100° + punta triangular alineada con la tangente
  const seg = (rot, cls, fillCls) => `<g transform="rotate(${rot} 256 256)">
    <path d="M196 130 A116 116 0 0 1 334 178" class="${cls}" stroke-width="24"/>
    <polygon points="302,132 372,164 306,222" class="${fillCls}"/>
  </g>`;
  const orden = v === 1 ? [['st1','c1'],['st2','c2'],['st3','c3']] : [['st2','c2'],['st3','c3'],['st1','c1']];
  return orden.map((p, i) => seg(i * 120, p[0], p[1])).join('');
};

// 13. Planeta
G['planeta'] = (e, v, uid) => {
  const sol = v === 1 ? `<path d="M404 108 C382 130 370 148 370 166 a34 34 0 0 0 68 0 C438 148 426 130 404 108 Z" class="c3"/>` : '';
  // anillo trasero (mitad superior, detrás del planeta)
  const anilloDetras = `<path d="M96 244 A160 56 -18 0 1 416 214" class="st3" stroke-width="9"/>`;
  const globo = `<circle cx="256" cy="256" r="118" class="c2"/>
  <ellipse cx="216" cy="226" rx="54" ry="30" class="c1" transform="rotate(-18 216 226)"/>
  <ellipse cx="298" cy="304" rx="44" ry="24" class="c1" transform="rotate(12 298 304)"/>`;
  // anillo delantero (mitad inferior, delante)
  const anilloDelante = `<path d="M416 214 A160 56 -18 0 1 96 244" class="st3" stroke-width="9"/>`;
  return sol + anilloDetras + globo + anilloDelante;
};

// 14. Brote
G['brote'] = (e, v, uid) => {
  let s = `<path d="M256 392 C256 310 252 280 256 224" class="st1" stroke-width="14"/>
  <path d="M256 268 C204 264 180 212 176 164 C230 170 252 214 256 268 Z" class="c2"/>
  <path d="M256 268 C308 264 332 212 336 164 C282 170 260 214 256 268 Z" class="c1"/>
  <path d="M136 396 Q256 356 376 396 L376 416 L136 416 Z" class="c4"/>`;
  if (v === 1) s += `<circle cx="404" cy="112" r="26" class="c3"/>`;
  return s;
};

// 15. Flor
G['flor'] = (e, v, uid) => {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const cls = i % 2 === 0 ? 'c1' : 'c2';
    s += `<ellipse cx="256" cy="160" rx="36" ry="72" class="${cls}" transform="rotate(${i * 72} 256 256)"/>`;
  }
  s += `<circle cx="256" cy="256" r="42" class="c3"/>`;
  if (v === 1) s += `<path d="M256 298 L256 428" class="st1" stroke-width="12"/><path d="M256 380 C220 376 204 344 200 314 C236 318 252 348 256 380 Z" class="c2"/>`;
  return s;
};

// 16. Ave
G['ave'] = (e, v, uid) => {
  let s = `<path d="M256 292 C210 216 140 210 84 250 C140 262 190 282 256 292 Z" class="c2"/>
  <path d="M256 292 C302 216 372 210 428 250 C372 262 322 282 256 292 Z" class="c1"/>
  <ellipse cx="256" cy="306" rx="56" ry="30" class="c1"/>
  <polygon points="306,296 344,306 306,318" class="c3"/>
  <circle cx="292" cy="296" r="7" class="f"/>`;
  if (v === 1) s += `<path d="M96 168 q18 -14 36 0 M132 190 q18 -14 36 0" class="st2" stroke-width="8"/>`;
  else s += `<circle cx="112" cy="132" r="30" class="c3"/>`;
  return s;
};

// 17. Pez
G['pez'] = (e, v, uid) => {
  let s = `<path d="M132 262 C176 192 316 192 376 262 C316 332 176 332 132 262 Z" class="c1"/>
  <polygon points="376,262 442,214 442,310" class="c2"/>
  <circle cx="188" cy="244" r="11" class="f"/>
  <path d="M232 262 q24 -20 48 0 q-24 20 -48 0 Z" class="c2"/>`;
  if (v === 1) s += `<circle cx="416" cy="130" r="10" class="c3"/><circle cx="440" cy="98" r="6" class="c3"/>`;
  return s;
};

// 18. Bosque
G['bosque'] = (e, v, uid) => {
  let s = `<polygon points="140,196 84,300 196,300" class="c2"/>
  <rect x="130" y="296" width="20" height="44" rx="6" class="c4"/>
  <polygon points="256,120 176,292 336,292" class="c1"/>
  <rect x="242" y="288" width="28" height="52" rx="8" class="c4"/>
  <circle cx="386" cy="248" r="56" class="c2"/>
  <rect x="374" y="296" width="24" height="44" rx="6" class="c4"/>
  <path d="M84 388 L428 388" class="st4" stroke-width="12"/>`;
  if (v === 1) s += `<circle cx="66" cy="110" r="24" class="c3"/>`;
  return s;
};

// 19. Sendero
G['sendero'] = (e, v, uid) => {

// CSS del estilo: mapea clases .cN (relleno), .stN (trazo), .f (blanco fijo), .fw (fondo blanco)
function cssEstilo(estiloId, esq, uid) {
  const { primario, secundario, acento, neutro } = esq;
  if (estiloId === 'plano') {
    return `.c1{fill:${primario}}.c2{fill:${secundario}}.c3{fill:${acento}}.c4{fill:${neutro}}
      .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${secundario}}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${neutro}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  if (estiloId === 'linea') {
    return `.c1{fill:${tinte(primario, 0.92)}}.c2{fill:${tinte(secundario, 0.92)}}.c3{fill:${tinte(acento, 0.85)}}.c4{fill:${tinte(neutro, 0.9)}}
      .st1{fill:none;stroke:${primario};stroke-linecap:round;stroke-linejoin:round}.st2{fill:none;stroke:${secundario};stroke-linecap:round;stroke-linejoin:round}
      .st3{fill:none;stroke:${acento};stroke-linecap:round}.st4{fill:none;stroke:${neutro};stroke-linecap:round}
      .f{fill:#fff}.fw{fill:none;stroke:${primario}}`;
  }
  if (estiloId === 'duotono') {
    return `.c1{fill:${primario}}.c2{fill:${tinte(primario, 0.55)}}.c3{fill:${secundario}}.c4{fill:${tinte(primario, 0.78)}}
      .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${tinte(primario, 0.4)}}.st3{fill:none;stroke:${secundario}}.st4{fill:none;stroke:${tinte(primario, 0.25)}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  if (estiloId === 'degradado') {
    return `.c1{fill:url(#gr${uid})}.c2{fill:url(#gr${uid})}.c3{fill:${acento}}.c4{fill:${tinte(primario, 0.35)}}
      .st1{fill:none;stroke:url(#gr${uid})}.st2{fill:none;stroke:url(#gr${uid})}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${tinte(primario, 0.35)}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  // insignia
  return `.c1{fill:#fff}.c2{fill:${tinte(secundario, 0.78)}}.c3{fill:${acento}}.c4{fill:${tinte(primario, 0.3)}}
    .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${secundario};stroke-linecap:round}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${primario}}
    .f{fill:${primario}}.fw{fill:none;stroke:${primario}}`;
}

function defsEstilo(estiloId, esq, uid) {
  if (estiloId !== 'degradado') return '';
  return `<defs><linearGradient id="gr${uid}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${esq.primario}"/><stop offset="1" stop-color="${esq.secundario}"/>
  </linearGradient></defs>`;
}

function fondoEstilo(estiloId, esq, uid) {
  if (estiloId === 'insignia') {
    return `<circle cx="256" cy="256" r="242" fill="${esq.primario}"/><circle cx="256" cy="256" r="212" fill="none" stroke="${esq.acento}" stroke-width="6"/>`;
  }
  return '';
}

function render(logo) {
  const esq = ESQUEMAS.find(e => e.id === logo.esquema);
  const gen = G[logo.concepto];
  if (!esq) throw new Error('Esquema desconocido: ' + logo.esquema);
  if (!gen) throw new Error('Concepto desconocido: ' + logo.concepto);
  const uid = logo.id.replace(/[^a-z0-9]/gi, '');
  const css = cssEstilo(logo.estilo, esq, uid);
  const cuerpo = gen(esq, logo.variante, uid);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">`
    + `<style>${css}</style>` + defsEstilo(logo.estilo, esq, uid) + fondoEstilo(logo.estilo, esq, uid) + cuerpo + `</svg>`;
}

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const estado = { cat: '', estilo: '', esq: '', q: '', actual: null };
  const FONDOS = {
    transparente: 'transparent',
    blanco: '#FFFFFF',
    claro: '#F0F3F7',
    oscuro: '#122A4D',
  };

  // filtros
  const selE = $('filtroEstilo');
  ESTILOS.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.nombre;
    selE.appendChild(o);
  });
  const selC = $('filtroEsquema');
  ESQUEMAS.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.nombre;
    selC.appendChild(o);
  });

  const chips = $('chips');
  [''].concat(CATEGORIAS).forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' activo' : '');
    b.textContent = c === '' ? 'Todas' : c;
    b.onclick = () => {
      estado.cat = c;
      chips.querySelectorAll('.chip').forEach(x => x.classList.remove('activo'));
      b.classList.add('activo');
      pintar();
    };
    chips.appendChild(b);
  });

  $('buscador').addEventListener('input', e => { estado.q = e.target.value.toLowerCase().trim(); pintar(); });
  $('filtroEstilo').addEventListener('change', e => { estado.estilo = e.target.value; pintar(); });
  $('filtroEsquema').addEventListener('change', e => { estado.esq = e.target.value; pintar(); });

  function filtrados() {
    return CATALOGO.filter(p => {
      if (estado.cat && p.categoria !== estado.cat) return false;
      if (estado.estilo && p.estilo !== estado.estilo) return false;
      if (estado.esq && p.esquema !== estado.esq) return false;
      if (estado.q) {
        const busq = p.nombre + ' ' + p.nombreEstilo + ' ' + p.nombreEsquema + ' ' + p.categoria;
        if (!busq.toLowerCase().includes(estado.q)) return false;
      }
      return true;
    });
  }

  function pintar() {
    const lista = filtrados();
    $('contador').textContent = lista.length + ' logo' + (lista.length === 1 ? '' : 's');
    const grid = $('grid');
    grid.innerHTML = '';
    if (!lista.length) {
      grid.innerHTML = '<div class="vacio">Sin resultados. Prueba con otra búsqueda.</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    // limitar el render inicial a 60 y cargar el resto al hacer scroll
    lista.slice(0, 60).forEach(p => frag.appendChild(tarjeta(p)));
    grid.appendChild(frag);
    if (lista.length > 60) {
      const resto = lista.slice(60);
      const io = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          const f2 = document.createDocumentFragment();
          resto.splice(0, 40).forEach(p => f2.appendChild(tarjeta(p)));
          grid.appendChild(f2);
          if (!resto.length) io.disconnect();
          else {
            // re-observar el último
            io.observe(grid.lastElementChild);
          }
        }
      });
      io.observe(grid.lastElementChild);
    }
  }

  function tarjeta(p) {
    const card = document.createElement('div');
    card.className = 'tarjeta';
    card.innerHTML = `<div class="thumb">${render(p)}</div>
      <div class="pie"><strong>${p.nombre}</strong><span>${p.nombreEstilo} · ${p.nombreEsquema}</span></div>`;
    card.onclick = () => abrir(p);
    return card;
  }

  // ---- Editor ----
  const modal = $('modal');
  let fondoActual = 'blanco';

  function abrir(p) {
    estado.actual = p;
    $('titEditor').textContent = p.nombre;
    $('subEditor').textContent = 'Estilo: ' + p.nombreEstilo + ' · Color: ' + p.nombreEsquema;
    const sw = $('swatches');
    sw.innerHTML = '';
    ESQUEMAS.forEach(e => {
      const d = document.createElement('div');
      d.className = 'swatch' + (e.id === p.esquema ? ' activo' : '');
      d.style.background = `linear-gradient(135deg, ${e.primario} 50%, ${e.secundario} 50%)`;
      d.title = e.nombre;
      d.onclick = () => {
        estado.actual = CATALOGO.find(x => x.concepto === p.concepto && x.variante === p.variante && x.estilo === p.estilo && x.esquema === e.id) || estado.actual;
        $('subEditor').textContent = 'Estilo: ' + estado.actual.nombreEstilo + ' · Color: ' + estado.actual.nombreEsquema;
        sw.querySelectorAll('.swatch').forEach(x => x.classList.remove('activo'));
        d.classList.add('activo');
        refrescar();
      };
      sw.appendChild(d);
    });
    refrescar();
    modal.classList.add('abierto');
  }

  function refrescar() {
    const v = $('vista');
    v.style.background = FONDOS[fondoActual];
    v.innerHTML = render(estado.actual);
    $('notaExport').textContent = fondoActual === 'transparente'
      ? 'El PNG se exportará con fondo transparente.'
      : 'El fondo elegido se incluye en la exportación.';
  }

  $('selFondo').addEventListener('change', e => { fondoActual = e.target.value; refrescar(); });
  $('rangoTam').addEventListener('input', e => { $('lblTam').textContent = e.target.value; });
  $('btnCerrar').addEventListener('click', () => modal.classList.remove('abierto'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('abierto'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('abierto')) modal.classList.remove('abierto'); });

  // ---- Exportación ----
  function svgActual(fondoParaExport) {
    const svg = render(estado.actual);
    if (fondoParaExport && fondoParaExport !== 'transparent') {
      // insertar rect de fondo tras el <style>
      return svg.replace(/(<\/style>)/, `$1<rect width="512" height="512" fill="${fondoParaExport}"/>`);
    }
    return svg;
  }

  function nombreArchivo(ext) {
    return estado.actual.id + '.' + ext;
  }

  function descargar(blob, nombre) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  $('btnSVG').addEventListener('click', () => {
    descargar(new Blob([svgActual(FONDOS[fondoActual])], { type: 'image/svg+xml' }), nombreArchivo('svg'));
  });

  function svgABitmap(px) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(new Blob([svgActual(FONDOS[fondoActual])], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = px; c.height = px;
        const ctx = c.getContext('2d');
        if (FONDOS[fondoActual] !== 'transparent') {
          ctx.fillStyle = FONDOS[fondoActual];
          ctx.fillRect(0, 0, c.width, c.height);
        }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = rej;
      img.src = url;
    });
  }

  $('btnPNG').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(+$('rangoTam').value);
      c.toBlob(b => descargar(b, nombreArchivo('png')), 'image/png');
    } catch (e) { alert('No se pudo generar el PNG: ' + e.message); }
  });

  $('btnCopiar').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(1024);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      const b = $('btnCopiar');
      const t = b.textContent;
      b.textContent = '✓ Copiada';
      setTimeout(() => b.textContent = t, 1600);
    } catch (e) {
      alert('Tu navegador no permite copiar imágenes. Usa «Descargar PNG» e insértala donde la necesites.');
    }
  });

  pintar();
})();
</script>
