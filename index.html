<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagramas y Logos Ambientales</title>
<style>
:root {
  --primario: #1A4488; --primario2: #3D6AB5; --acento: #CB1823;
  --texto: #2B3440; --medio: #8A94A0; --claro: #DDE3EA; --fondo: #EEF2F7; --blanco: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--fondo); color: var(--texto); height: 100vh; overflow: hidden; }

/* --- cabecera compacta --- */
header {
  height: 58px; background: var(--blanco); border-bottom: 1px solid var(--claro);
  display: flex; align-items: center; gap: 16px; padding: 0 24px;
}
header .marca { width: 34px; height: 34px; }
header h1 { font-size: 16.5px; font-weight: 700; color: var(--primario); white-space: nowrap; }
.tabs { display: flex; gap: 6px; background: var(--fondo); padding: 4px; border-radius: 999px; }
.tab { padding: 7px 22px; border-radius: 999px; border: none; background: transparent; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--medio); }
.tab.activo { background: var(--primario); color: #fff; box-shadow: 0 2px 8px rgba(26,68,136,.25); }
.header-bus { margin-left: auto; display: flex; gap: 10px; align-items: center; }
#buscador { width: 260px; padding: 9px 16px; border: 1.5px solid var(--claro); border-radius: 999px; font-size: 14px; outline: none; }
#buscador:focus { border-color: var(--primario2); }

/* --- layout PC: sidebar + editor --- */
.app { display: flex; height: calc(100vh - 58px); }
.sidebar {
  width: 340px; flex: none; background: var(--blanco); border-right: 1px solid var(--claro);
  display: flex; flex-direction: column;
}
.filtros { padding: 14px 18px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 13px; border-radius: 999px; border: 1.5px solid var(--claro); background: var(--blanco); font-size: 12px; cursor: pointer; color: var(--texto); }
.chip:hover { border-color: var(--primario2); }
.chip.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
#contador { padding: 4px 18px 10px; font-size: 12px; color: var(--medio); }
.lista { flex: 1; overflow-y: auto; padding: 6px 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
.item {
  background: var(--blanco); border: 1.5px solid var(--claro); border-radius: 14px;
  overflow: hidden; cursor: pointer; transition: all .12s; position: relative;
}
.item:hover { border-color: var(--primario2); box-shadow: 0 6px 16px rgba(26,68,136,.12); transform: translateY(-1px); }
.item.activo { border-color: var(--primario); box-shadow: 0 0 0 2.5px rgba(26,68,136,.25); }
.item .th { display: flex; align-items: center; justify-content: center; padding: 8px; }
.item .th svg { width: 100%; height: auto; border-radius: 8px; }
.item .nom { padding: 7px 10px; font-size: 11.5px; font-weight: 600; border-top: 1px solid #F0F3F7; color: var(--texto);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vacio { grid-column: 1/-1; text-align: center; padding: 40px 10px; color: var(--medio); font-size: 13px; }

/* --- editor grande --- */
.editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.lienzo-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 26px; }
#lienzo svg { max-width: 100%; height: auto; border-radius: 14px; box-shadow: 0 10px 40px rgba(20,40,80,.14); background: #fff; }
.barra {
  background: var(--blanco); border-top: 1px solid var(--claro);
  padding: 12px 24px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
}
.grupo { display: flex; align-items: center; gap: 10px; }
.grupo label { font-size: 12px; font-weight: 600; color: var(--medio); white-space: nowrap; }
.swatches { display: flex; gap: 7px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.swatch:hover { transform: scale(1.12); }
.swatch.activo { border-color: var(--texto); box-shadow: 0 0 0 2px #fff inset; }
.btn {
  padding: 10px 20px; border: none; border-radius: 11px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn-primario { background: var(--primario); color: #fff; box-shadow: 0 3px 10px rgba(26,68,136,.3); }
.btn-secundario { background: #E8EDF4; color: var(--primario); }
.btn:hover { filter: brightness(1.07); }
select { padding: 8px 12px; border: 1.5px solid var(--claro); border-radius: 9px; font-size: 13px; outline: none; background: var(--blanco); }
#selLogo { max-width: 170px; }
input[type="range"] { width: 110px; }
.sep { width: 1px; height: 34px; background: var(--claro); }

/* panel de textos flotante */
#panelTextos {
  position: absolute; right: 24px; top: 82px; width: 280px; max-height: calc(100vh - 220px);
  overflow-y: auto; background: var(--blanco); border: 1px solid var(--claro); border-radius: 16px;
  box-shadow: 0 12px 40px rgba(20,40,80,.18); padding: 16px; z-index: 40;
}
#panelTextos h3 { font-size: 13px; color: var(--primario); margin-bottom: 10px; }
#panelTextos input { width: 100%; padding: 8px 11px; border: 1.5px solid var(--claro); border-radius: 9px; font-size: 13px; margin-bottom: 7px; outline: none; }
#panelTextos input:focus { border-color: var(--primario2); }
#btnTextos { position: absolute; right: 24px; top: 82px; z-index: 39; }
.oculto { display: none !important; }
</style>
</head>
<body>
<header>
  <svg class="marca" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1A4488"/><path d="M24 10c-7 4-10 10-8 17 3 1 7 1 10-1 4-2 6-7 5-11-1-3-4-5-7-5zm-1 6c2 3 3 7 2 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M15 34c6 2 12 2 18 0" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>

<script>
// ============================================================
// PALETA — Esquemas de color derivados del manual de identidad

// Cada esquema aporta 4 roles: primario / secundario / acento / neutro.
// ============================================================

const ESQUEMAS = [
  { id: 'corporativo', nombre: 'Corporativo',

  { id: 'oceanico', nombre: 'Oceánico profundo',
    primario: '#0B4F6C', secundario: '#3D8FA8', acento: '#5E9E7E', neutro: '#5F7480' },
  { id: 'monocromo', nombre: 'Monocromo sobrio',
    primario: '#3D4A5C', secundario: '#7B8794', acento: '#1A4488', neutro: '#A6ADB5' },
];

// Mezcla el color hacia blanco (t>0) o negro (t<0)
function tinte(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const destino = t >= 0 ? 255 : 0;
  const f = Math.abs(t);
  r = Math.round(r + (destino - r) * f);
  g = Math.round(g + (destino - g) * f);
  b = Math.round(b + (destino - b) * f);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}



// Grises de apoyo
const GRISES = {
  oscuro: '#2B3440',
  texto: '#33404F',
  medio: '#8A94A0',
  claro: '#C9D0D8',
  fondo: '#F2F4F7',
  blanco: '#FFFFFF',
};

function escapar(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textoSVG(x, y, txt, opts = {}) {
  const { size = 14, peso = 600, color = '#33404F', ancla = 'middle', maxAncho = 140, lineas = null } = opts;
  const parts = [];
  const contenido = lineas || partirTexto(txt, maxAncho, size);
  const altoLinea = size * 1.25;
  const y0 = y - ((contenido.length - 1) * altoLinea) / 2;
  parts.push(`<text x="${x}" y="${y0}" text-anchor="${ancla}" font-family="'Segoe UI', Arial, sans-serif" font-size="${size}" font-weight="${peso}" fill="${color}">`);
  contenido.forEach((l, i) => parts.push(`<tspan x="${x}" dy="${i === 0 ? 0 : altoLinea}">${escapar(l)}</tspan>`));
  parts.push('</text>');
  return parts.join('');
}

function partirTexto(txt, maxAncho, size) {
  const caracteres = Math.max(6, Math.floor(maxAncho / (size * 0.56)));
  const palabras = String(txt).split(/\s+/);
  const lineas = [];
  let actual = '';
  for (const p of palabras) {
    if ((actual + ' ' + p).trim().length <= caracteres) {
      actual = (actual + ' ' + p).trim();
    } else {
      if (actual) lineas.push(actual);
      actual = p;
    }
  }
  if (actual) lineas.push(actual);
  return lineas.slice(0, 4);
}

// Categorías y tipos de diagrama

const TEXTOS_DEFAULT = [
  'Identificación', 'Análisis', 'Diagnóstico', 'Planificación',
  'Implantación', 'Seguimiento', 'Evaluación', 'Mejora continua',
];

function textosDefault(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(TEXTOS_DEFAULT[i % TEXTOS_DEFAULT.length]);
  return out;
}



// ============================================================
// GENERADORES DE LOGOS — 30 conceptos ambientales en SVG 512×512.
// Cada generador: (esquema, variante, uid) → cuerpo SVG.
// Colores por CLASES (.c1..c4 relleno, .st1..st4 trazo, .f blanco)
// para que el estilo (plano/línea/duotono/degradado/insignia)
// se aplique desde catálogo.js sin tocar el dibujo.
// ============================================================

const G = {};

// 1. Árbol copudo
G['arbol'] = (e, v, uid) => {
  let s = '';
  if (v === 1) s += `<circle cx="330" cy="180" r="60" class="c2"/>`;
  s += `<rect x="242" y="270" width="28" height="110" rx="10" class="c4"/>`;
  s += `<circle cx="256" cy="200" r="95" class="c1"/>`;
  s += `<circle cx="200" cy="250" r="55" class="c2"/>`;
  s += `<circle cx="315" cy="245" r="52" class="c2"/>`;
  s += `<circle cx="310" cy="160" r="16" class="c3"/>`;
  s += `<path d="M130 392 Q256 366 382 392" class="st4" stroke-width="12"/>`;
  return s;
};

// 2. Pino
G['pino'] = (e, v, uid) => {
  let s = `<polygon points="256,86 168,214 344,214" class="c1"/>
  <polygon points="256,150 148,296 364,296" class="c1"/>
  <polygon points="256,216 128,384 384,384" class="c2"/>
  <rect x="240" y="378" width="32" height="56" rx="8" class="c4"/>`;
  if (v === 1) s += `<circle cx="404" cy="120" r="26" class="c3"/>`;

};

// 3. Hoja
G['hoja'] = (e, v, uid) => {
  let s = `<path d="M256 108 C168 152 152 288 256 404 C360 288 344 152 256 108 Z" class="c1"/>
  <path d="M256 140 L256 380" class="fw" stroke-width="8"/>
  <path d="M256 210 L320 176 M256 270 L318 238 M256 210 L192 176 M256 270 L194 238" class="fw" stroke-width="6"/>`;
  if (v === 1) s += `<circle cx="392" cy="120" r="24" class="c3"/>`;

};

// 4. Montaña
G['montana'] = (e, v, uid) => {

};

G['carretera'] = (e, v, uid) => {

};

G['camino'] = (e, v, uid) => {

G['turbina'] = (e, v, uid) => {

};

// 9. Panel solar
G['panel-solar'] = (e, v, uid) => {

  <path d="M187 280 L172 384 M249 280 L249 384 M293 280 L330 384 M109 332 L327 332" class="fw" stroke-width="6"/>

// ============================================================
// ESTILOS DE LOGO — piel (plano/línea/duotono/degradado/insignia)
// aplicada sobre los dibujos geométricos mediante clases CSS.
// ============================================================


function cssEstilo(estiloId, esq, uid) {
  const { primario, secundario, acento, neutro } = esq;
  if (estiloId === 'plano') {
    return `.c1{fill:${primario}}.c2{fill:${secundario}}.c3{fill:${acento}}.c4{fill:${neutro}}
      .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${secundario}}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${neutro}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  if (estiloId === 'linea') {
    return `.c1{fill:${tinte(primario, 0.92)}}.c2{fill:${tinte(secundario, 0.92)}}.c3{fill:${tinte(acento, 0.85)}}.c4{fill:${tinte(neutro, 0.9)}}
      .st1{fill:none;stroke:${primario};stroke-linecap:round;stroke-linejoin:round}.st2{fill:none;stroke:${secundario};stroke-linecap:round;stroke-linejoin:round}
      .st3{fill:none;stroke:${acento};stroke-linecap:round}.st4{fill:none;stroke:${neutro};stroke-linecap:round}
      .f{fill:#fff}.fw{fill:none;stroke:${primario}}`;
  }
  if (estiloId === 'duotono') {
    return `.c1{fill:${primario}}.c2{fill:${tinte(primario, 0.55)}}.c3{fill:${secundario}}.c4{fill:${tinte(primario, 0.78)}}
      .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${tinte(primario, 0.4)}}.st3{fill:none;stroke:${secundario}}.st4{fill:none;stroke:${tinte(primario, 0.25)}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  if (estiloId === 'degradado') {
    return `.c1{fill:url(#gr${uid})}.c2{fill:url(#gr${uid})}.c3{fill:${acento}}.c4{fill:${tinte(primario, 0.35)}}
      .st1{fill:none;stroke:url(#gr${uid})}.st2{fill:none;stroke:url(#gr${uid})}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${tinte(primario, 0.35)}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  // insignia
  return `.c1{fill:#fff}.c2{fill:${tinte(secundario, 0.78)}}.c3{fill:${acento}}.c4{fill:${tinte(primario, 0.3)}}
    .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${secundario};stroke-linecap:round}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${primario}}
    .f{fill:${primario}}.fw{fill:none;stroke:${primario}}`;
}

function defsEstilo(estiloId, esq, uid) {
  if (estiloId !== 'degradado') return '';
  return `<defs><linearGradient id="gr${uid}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${esq.primario}"/><stop offset="1" stop-color="${esq.secundario}"/>
  </linearGradient></defs>`;
}

function fondoEstilo(estiloId, esq, uid) {
  if (estiloId === 'insignia') {
    return `<circle cx="256" cy="256" r="242" fill="${esq.primario}"/><circle cx="256" cy="256" r="212" fill="none" stroke="${esq.acento}" stroke-width="6"/>`;
  }
  return '';
}



// ============================================================
// SMARTART — 10 generadores de diagramas estilo 2026.
// Cada generador recibe (esq, textos, logo) donde logo = { concepto,
// variante, estilo } o null. Devuelven el cuerpo SVG 900x560.
// Todas las filas llevan chip circular con logo incrustado.
// ============================================================

// cssEstiloPara/defsEstilo viven en catalogo.js (mismo scope en el bundle)
const cssEstiloPara = typeof cssEstilo !== 'undefined' ? cssEstilo : null;

// Chip circular con logo: círculo con degradado + logo escalado dentro
function chipLogo(esq, logo, cx, cy, r, uid) {
  if (!logo || !G[logo.concepto]) {
    // sin logo: círculo con número no — degradado suave
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gchip${uid})"/>`;
  }
  const genLogo = G[logo.concepto];
  const escala = (r * 2 * 0.78) / 512;
  const despl = r - 512 * escala / 2;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFFFFF" stroke="${tinte(esq.primario, 0.85)}" stroke-width="2"/>
  <g transform="translate(${cx - r + despl} ${cy - r + despl}) scale(${escala})">
    <style>${cssEstiloPara(logo.estilo || 'plano', esq, 'c' + uid)}</style>
    ${defsEstilo(logo.estilo || 'plano', esq, 'c' + uid)}
    ${genLogo(esq, logo.variante || 1, 'c' + uid)}
  </g>`;
}

const S = {};

// ---------- 1. PROCESO HORIZONTAL (5 pasos) ----------
S['proceso-horizontal'] = (esq, t, logo, uid) => {
  const n = t.length, W = 900, H = 560;
  const cardW = Math.min(150, (W - 120 - (n - 1) * 24) / n), cardH = 200;
  const x0 = (W - (n * cardW + (n - 1) * 24)) / 2;
  const y = 210;
  let s = '';
  t.forEach((txt, i) => {
    const x = x0 + i * (cardW + 24);
    const grad = i % 2 === 0 ? `url(#gp${uid}a)` : `url(#gp${uid}b)`;
    s += `<g data-i="${i}">
      <rect x="${x}" y="${y}" width="${cardW}" height="${cardH}" rx="22" fill="${grad}"/>
      ${chipLogo(esq, logo, x + cardW / 2, y + 52, 34, uid + i)}
      ${textoSVG(x + cardW / 2, y + 118, txt, { color: '#fff', size: 14, peso: 700, maxAncho: cardW - 18 })}
      <rect x="${x + cardW / 2 - 22}" y="${y + cardH - 40}" width="44" height="6" rx="3" fill="#fff" opacity="0.45"/>
    </g>`;
    if (i < n - 1) s += `<path d="M${x + cardW + 4} ${y + cardH / 2} h16" stroke="${GRISES.claro}" stroke-width="3" marker-end="url(#punta)"/>`;
  });
  return s;
};

// ---------- 2. PROCESO VERTICAL (6 pasos) ----------
S['proceso-vertical'] = (esq, t, logo, uid) => {
  const n = t.length, H = 560;
  const rowH = Math.min(74, (H - 120) / n - 8);
  const gap = (H - 100 - n * rowH) / Math.max(1, n - 1);
  const y0 = 60;
  let s = `<line x1="196" y1="${y0 + 24}" x2="196" y2="${y0 + (n - 1) * (rowH + gap) + 40}" stroke="${tinte(esq.primario, 0.8)}" stroke-width="3"/>`;
  t.forEach((txt, i) => {
    const y = y0 + i * (rowH + gap);
    const grad = i % 2 === 0 ? `url(#gp${uid}a)` : `url(#gp${uid}b)`;
    s += `<g data-i="${i}">
      <rect x="160" y="${y}" width="640" height="${rowH}" rx="${rowH / 2}" fill="${i % 2 ? tinte(esq.secundario, 0.9) : tinte(esq.primario, 0.92)}"/>
      ${chipLogo(esq, logo, 196, y + rowH / 2, rowH / 2 - 8, uid + i)}
      ${textoSVG(240, y + rowH / 2 + 5, txt, { color: GRISES.texto, ancla: 'start', size: 15, peso: 600, maxAncho: 540 })}
    </g>`;
  });
  return s;
};

// ---------- 3. CICLO (4-6 pasos) ----------

// ---------- 11. INFOGRAFÍA DE PROCESO (estilo informe consultoría) ----------
// Cada paso: "Título" en texts[]; párrafo y herramientas en textos extra:
// estructura texts[i] = título; textosPar[i] = párrafo; textosHerr[i] = "a;b;c"
S['infografia'] = (esq, t, logo, uid, par, herr) => {
  const n = t.length, W = 1400, H = 860;
  const colW = Math.min(180, (W - 140 - (n - 1) * 14) / n);
  const x0 = (W - (n * colW + (n - 1) * 14)) / 2;
  const usarPar = par && par.length;
  const usarHerr = herr && herr.length;
  const colH = usarHerr ? 520 : (usarPar ? 400 : 260);
  const y0 = 250;
  let s = '';
  // cabecera del lienzo
  s += textoSVG(70, 62, 'Proceso', { color: esq.primario, ancla: 'start', size: 30, peso: 700 });
  s += textoSVG(70, 96, 'Síntesis de las etapas del trabajo', { color: GRISES.medio, ancla: 'start', size: 15, peso: 400 });
  if (logo && G[logo.concepto]) {
    const genLogo = G[logo.concepto];
    s += '<g transform="translate(' + (W - 190) + ' 20) scale(0.24)">'
      + '<style>' + cssEstilo(logo.estilo || 'plano', esq, 'cab' + uid) + '</style>'
      + defsEstilo(logo.estilo || 'plano', esq, 'cab' + uid)
      + genLogo(esq, logo.variante || 1, 'cab' + uid) + '</g>';
  }
  // banda de fuentes
  s += '<rect x="70" y="126" width="' + (W - 140) + '" height="64" rx="16" fill="' + tinte(esq.primario, 0.94) + '"/>';
  s += textoSVG(W / 2, 165, 'Fuentes clave · información acústica, territorial, ambiental y participación', { color: esq.primario, size: 14.5, peso: 600, maxAncho: W - 260 });
  t.forEach((titulo, i) => {
    const x = x0 + i * (colW + 14);
    const grad = i % 2 === 0 ? `url(#gp${uid}a)` : `url(#gp${uid}b)`;
    // columna
    s += '<g data-i="' + i + '">';
    s += '<rect x="' + x + '" y="' + y0 + '" width="' + colW + '" height="' + colH + '" rx="18" fill="#fff" stroke="' + GRISES.claro + '" stroke-width="1.5" filter="url(#som)"/>';
    // banner número + título
    s += '<path d="M' + x + ' ' + (y0 + 18) + ' q0 -18 18 -18 h' + (colW - 36) + ' q18 0 18 18 v46 h-' + colW + ' Z" fill="' + grad + '"/>';
    s += '<circle cx="' + (x + 34) + '" cy="' + (y0 + 40) + '" r="16" fill="#fff" opacity="0.22"/>';
    s += textoSVG(x + 34, y0 + 45, String(i + 1), { color: '#fff', size: 15, peso: 700 });
    s += textoSVG(x + colW / 2 + 14, y0 + 45, titulo, { color: '#fff', size: 11.5, peso: 700, maxAncho: colW - 78 });
    // icono grande: el logo
    const genLogo = G[logo && logo.concepto];
    if (genLogo) {
      s += '<g transform="translate(' + (x + colW / 2 - 44) + ' ' + (y0 + 86) + ') scale(' + (88 / 512) + ')">'
        + '<style>' + cssEstilo(logo.estilo || 'plano', esq, 'ic' + uid + i) + '</style>'
        + defsEstilo(logo.estilo || 'plano', esq, 'ic' + uid + i)
        + genLogo(esq, logo.variante || 1, 'ic' + uid + i) + '</g>';
    }
    let yy = y0 + 200;
    // párrafo
    if (usarPar && par[i]) {
      s += textoSVG(x + colW / 2, yy + 8, par[i], { color: GRISES.texto, size: 10.5, peso: 400, maxAncho: colW - 26 });
      yy += 96;
    }
    // caja de herramientas
    if (usarHerr && herr[i]) {
      const items = String(herr[i]).split(';').filter(Boolean).slice(0, 3);
      const hCaja = 26 + items.length * 20;
      s += '<rect x="' + (x + 10) + '" y="' + (y0 + colH - hCaja - 12) + '" width="' + (colW - 20) + '" height="' + hCaja + '" rx="12" fill="' + tinte(esq.secundario, 0.88) + '"/>';
      let hy = y0 + colH - hCaja + 8;
      items.forEach(h => {
        s += '<circle cx="' + (x + 24) + '" cy="' + (hy + 4) + '" r="2.6" fill="' + esq.secundario + '"/>';
        s += textoSVG(x + 33, hy + 8, h.trim(), { color: esq.primario, ancla: 'start', size: 10, peso: 600, maxAncho: colW - 50 });
        hy += 20;
      });
    }
    s += '</g>';
    // chevron conector
    if (i < n - 1) {
      const xc = x + colW + 7;
      s += '<path d="M' + xc + ' ' + (y0 + colH / 2 - 10) + ' l8 10 l-8 10" fill="none" stroke="' + esq.secundario + '" stroke-width="3" stroke-linecap="round"/>';
    }
  });
  // banner pie
  s += '<rect x="70" y="' + (y0 + colH + 34) + '" width="' + (W - 140) + '" height="58" rx="16" fill="url(#gchip' + uid + ')"/>';
  s += textoSVG(W / 2, y0 + colH + 70, 'Aproximación integrada · síntesis por etapas', { color: '#fff', size: 15, peso: 700, maxAncho: W - 300 });
  return s;
};

// CSS del estilo: mapea clases .cN (relleno), .stN (trazo), .f (blanco fijo), .fw (fondo blanco)


function render(logo) {
  const esq = ESQUEMAS.find(e => e.id === logo.esquema);
  const gen = G[logo.concepto];
  if (!esq) throw new Error('Esquema desconocido: ' + logo.esquema);
  if (!gen) throw new Error('Concepto desconocido: ' + logo.concepto);
  const uid = logo.id.replace(/[^a-z0-9]/gi, '');
  const css = cssEstilo(logo.estilo, esq, uid);
  const cuerpo = gen(esq, logo.variante, uid);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">`
    + `<style>${css}</style>` + defsEstilo(logo.estilo, esq, uid) + fondoEstilo(logo.estilo, esq, uid) + cuerpo + `</svg>`;
}

// ============================================================
// CATÁLOGO UNIFICADO — 50 diagramas + 50 logos.
// Los esquemas son editables en vivo desde el editor, así que
// el catálogo reparte esquemas para que la galería luzca variada.
// ============================================================



function construirCatalogo() {
  const items = [];

  const ordenEsqD = ['corporativo','verde-eco','azul-pro','agua','energia','tierra','biodiversidad','atardecer','oceanico','monocromo'];
  // ---- 50 DIAGRAMAS (10 tipos × 5 esquemas asignados en rotación) ----
  TIPOS_SMARTART.forEach((t, i) => {
    items.push({ id: 'd-' + t.id, clase: 'diagrama', tipo: t.id, nombre: t.nombre,
      categoria: t.cat, esquema: ordenEsqD[i % 10], pasos: t.pasos });
  });
  // 40 más: cada tipo con otros 4 esquemas (10 tipos × 5 = 50)
  TIPOS_SMARTART.forEach((t, ti) => {
    for (let k = 1; k < 5; k++) {
      items.push({ id: 'd' + k + '-' + t.id, clase: 'diagrama', tipo: t.id,
        nombre: t.nombre + ' · ' + ESQUEMAS[(ti + k * 2) % 10].nombre,
        categoria: t.cat, esquema: ordenEsqD[(ti + k * 2) % 10], pasos: t.pasos });
    }
  });

  // ---- 50 LOGOS ----
  const ordenEsqL = ['corporativo','verde-eco','azul-pro','agua','energia','tierra','biodiversidad','atardecer','oceanico','monocromo'];
  const estilos = ['plano','linea','duotono','degradado','insignia'];
  CONCEPTOS.forEach((c, i) => {
    items.push({
      id: 'l-' + c.id + '-v1-' + estilos[i % 5],
      clase: 'logo',
      concepto: c.id,
      nombre: c.nombre,
      categoria: c.cat,
      variante: 1,
      estilo: estilos[i % 5],
      esquema: ordenEsqL[i % 10],
    });
  });
  // 20 logos adicionales: composición 2 con otro estilo/esquema
  CONCEPTOS.slice(0, 20).forEach((c, i) => {
    items.push({
      id: 'l2-' + c.id + '-v2-' + estilos[(i + 2) % 5],
      clase: 'logo',
      concepto: c.id,
      nombre: c.nombre + ' · B',
      categoria: c.cat,
      variante: 2,
      estilo: estilos[(i + 2) % 5],
      esquema: ordenEsqL[(i + 3) % 10],
    });
  });

  return items;
}

const CATALOGO = construirCatalogo();

function render(item) {
  const esq = ESQUEMAS.find(e => e.id === item.esquema);
  if (!esq) throw new Error('Esquema desconocido: ' + item.esquema);
  if (item.clase === 'diagrama') {
    const gen = S[item.tipo];
    if (!gen) throw new Error('Diagrama desconocido: ' + item.tipo);
    const textos = item.textos || textosDefault(item.pasos);
    const uid = item.id.replace(/[^a-z0-9]/gi, '').slice(-6);
    const logo = item.logoConcepto && G[item.logoConcepto]
      ? { concepto: item.logoConcepto, variante: item.logoVariante || 1, estilo: item.logoEstilo || 'plano' }
      : null;
    const defs = '<defs>'
      + '<linearGradient id="gp' + uid + 'a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + esq.primario + '"/><stop offset="1" stop-color="' + esq.secundario + '"/></linearGradient>'
      + '<linearGradient id="gp' + uid + 'b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + tinte(esq.primario, 0.25) + '"/><stop offset="1" stop-color="' + esq.secundario + '"/></linearGradient>'
      + '<linearGradient id="gchip' + uid + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + esq.primario + '"/><stop offset="1" stop-color="' + tinte(esq.secundario, 0.4) + '"/></linearGradient>'
      + '<filter id="som" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A3355" flood-opacity="0.18"/></filter>'
      + '<marker id="punta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="' + GRISES.medio + '"/></marker>'
      + '</defs>';
    const esInfo = item.tipo === 'infografia';
    const [vw, vh] = esInfo ? [1400, 860] : [900, 560];
    const cuerpo = esInfo
      ? gen(esq, textos, logo, uid, item.textosPar, item.textosHerr)
      : gen(esq, textos, logo, uid);
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + vw + ' ' + vh + '" width="' + vw + '" height="' + vh + '">'
      + '<rect width="' + vw + '" height="' + vh + '" rx="18" fill="#FFFFFF"/>'
      + defs + cuerpo + '</svg>';
  }
  const gen = G[item.concepto];
  if (!gen) throw new Error('Logo desconocido: ' + item.concepto);
  const uid = item.id.replace(/[^a-z0-9]/gi, '');
  const css = cssEstilo(item.estilo, esq, uid);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">'
    + '<style>' + css + '</style>' + defsEstilo(item.estilo, esq, uid) + fondoEstilo(item.estilo, esq, uid)
    + gen(esq, item.variante, uid) + '</svg>';
}

const CATEGORIAS_UNIFICADAS = [...new Set(CATALOGO.map(p => p.categoria))];

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const estado = { pestana: 'diagrama', cat: '', esq: '', q: '', actual: null };
  const FONDOS = { transparente: 'transparent', blanco: '#FFFFFF', claro: '#F0F3F7', oscuro: '#122A4D' };
  const textosGuardados = {};

  // pestañas
  $('tabDiagramas').onclick = () => cambiarPestana('diagrama');
  $('tabLogos').onclick = () => cambiarPestana('logo');
  function cambiarPestana(clase) {
    estado.pestana = clase; estado.cat = '';
    $('tabDiagramas').classList.toggle('activo', clase === 'diagrama');
    $('tabLogos').classList.toggle('activo', clase === 'logo');
    pintarChips(); pintarLista();
  }

  // chips de categoría
  function pintarChips() {
    const cats = [''].concat(CATEGORIAS_UNIFICADAS.filter(c => CATALOGO.some(p => p.clase === estado.pestana && p.categoria === c)));
    const chips = $('chips');
    chips.innerHTML = '';
    cats.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === 0 ? ' activo' : '');
      b.textContent = c === '' ? 'Todas' : c;
      b.onclick = () => {
        estado.cat = c;
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('activo'));
        b.classList.add('activo');
        pintarLista();
      };
      chips.appendChild(b);
    });
  }

  $('buscador').addEventListener('input', e => { estado.q = e.target.value.toLowerCase().trim(); pintarLista(); });

  function filtrados() {
    return CATALOGO.filter(p => {
      if (p.clase !== estado.pestana) return false;
      if (estado.cat && p.categoria !== estado.cat) return false;
      if (estado.q && !(p.nombre + ' ' + p.categoria).toLowerCase().includes(estado.q)) return false;
      return true;
    });
  }

  function pintarLista() {
    const lista = filtrados();
    $('contador').textContent = lista.length + ' plantillas';
    const cont = $('lista');
    const scroll = cont.scrollTop;
    cont.innerHTML = '';
    if (!lista.length) { cont.innerHTML = '<div class="vacio">Sin resultados</div>'; return; }
    lista.forEach(p => {
      const d = document.createElement('div');
      d.className = 'item' + (estado.actual && estado.actual.id === p.id ? ' activo' : '');
      d.innerHTML = '<div class="th">' + render(p) + '</div><div class="nom">' + p.nombre + '</div>';
      d.onclick = function () { abrir(p, this); };
      cont.appendChild(d);
    });
    cont.scrollTop = scroll;
  }

  function abrir(p, el) {
    estado.actual = JSON.parse(JSON.stringify(p));
    estado.actual.textos = (textosGuardados[p.id] || []).slice() || undefined;
    if (!estado.actual.textos || !estado.actual.textos.length) estado.actual.textos = undefined;
    if (textosGuardados[p.id + ':par']) estado.actual.textosPar = textosGuardados[p.id + ':par'].slice();
    if (textosGuardados[p.id + ':herr']) estado.actual.textosHerr = textosGuardados[p.id + ':herr'].slice();
    document.querySelectorAll('.item').forEach(x => x.classList.remove('activo'));
    if (el) el.classList.add('activo');
    configurarBarra();
    $('lienzo').innerHTML = render(estado.actual);
  }

  function configurarBarra() {
    const p = estado.actual;
    const esD = p.clase === 'diagrama';
    $('grpPasos').classList.toggle('oculto', !esD);
    $('grpLogo').classList.toggle('oculto', !esD);
    $('grpFondo').classList.toggle('oculto', esD);
    $('btnTextos').classList.toggle('oculto', !esD);
    $('panelTextos').classList.add('oculto');
    if (esD) {
      const selP = $('selPasos');
      selP.innerHTML = '';
      for (let n = 3; n <= 8; n++) {
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        if (n === p.pasos) o.selected = true;
        selP.appendChild(o);
      }
      const selL = $('selLogo');
      selL.innerHTML = '<option value="">— Sin logo —</option>';
      CONCEPTOS.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.nombre;
        if (p.logoConcepto === c.id) o.selected = true;
        selL.appendChild(o);
      });
      pintarTextos();
    }
    pintarSwatches();
  }

  function pintarSwatches() {
    const sw = $('swatches');
    sw.innerHTML = '';
    ESQUEMAS.forEach(e => {
      const d = document.createElement('div');
      d.className = 'swatch' + (e.id === estado.actual.esquema ? ' activo' : '');
      d.style.background = 'linear-gradient(135deg,' + e.primario + ' 50%,' + e.secundario + ' 50%)';
      d.title = e.nombre;
      d.onclick = () => { estado.actual.esquema = e.id; pintarSwatches(); refrescar(); };
      sw.appendChild(d);
    });
  }

  function pintarTextos() {
    const cont = $('listaTextos');
    cont.innerHTML = '';
    const esInfo = estado.actual.tipo === 'infografia';
    const textos = estado.actual.textos || textosDefault(estado.actual.pasos);
    textos.forEach((t, i) => {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = t;
      inp.placeholder = esInfo ? 'Paso ' + (i + 1) + ' · título' : 'Elemento ' + (i + 1);
      inp.addEventListener('input', () => {
        if (!estado.actual.textos) estado.actual.textos = textosDefault(estado.actual.pasos);
        estado.actual.textos[i] = inp.value;
        textosGuardados[estado.actual.id] = estado.actual.textos.slice();
        refrescar();
      });
      cont.appendChild(inp);
      if (esInfo) {
        const par = document.createElement('input');
        par.type = 'text';
        par.value = (estado.actual.textosPar || [])[i] || '';
        par.placeholder = 'Párrafo del paso ' + (i + 1);
        par.addEventListener('input', () => {
          if (!estado.actual.textosPar) estado.actual.textosPar = [];
          estado.actual.textosPar[i] = par.value;
          textosGuardados[estado.actual.id + ':par'] = estado.actual.textosPar.slice();
          refrescar();
        });
        cont.appendChild(par);
        const herr = document.createElement('input');
        herr.type = 'text';
        herr.value = (estado.actual.textosHerr || [])[i] || '';
        herr.placeholder = 'Herramientas (separa con ;)';
        herr.addEventListener('input', () => {
          if (!estado.actual.textosHerr) estado.actual.textosHerr = [];
          estado.actual.textosHerr[i] = herr.value;
          textosGuardados[estado.actual.id + ':herr'] = estado.actual.textosHerr.slice();
          refrescar();
        });
        cont.appendChild(herr);
      }
    });
  }

  function refrescar() {
    $('lienzo').innerHTML = render(estado.actual);
  }

  $('selPasos').addEventListener('change', e => {
    const n = +e.target.value;
    const base = estado.actual.textos || textosDefault(estado.actual.pasos);
    const def = textosDefault(n);
    const nuevos = [];
    for (let i = 0; i < n; i++) nuevos.push(base[i] !== undefined ? base[i] : def[i]);
    estado.actual.textos = nuevos; estado.actual.pasos = n;
    textosGuardados[estado.actual.id] = nuevos.slice();
    pintarTextos(); refrescar();
  });
  $('selLogo').addEventListener('change', e => {
    estado.actual.logoConcepto = e.target.value || undefined;
    refrescar();
  });
  $('selFondo').addEventListener('change', e => {
    $('lienzo').style.background = FONDOS[e.target.value];
  });
  $('btnTextos').addEventListener('click', () => $('panelTextos').classList.toggle('oculto'));
  $('rangoTam').addEventListener('input', e => { $('lblTam').textContent = e.target.value + 'px'; });

  // exportación
  function svgExport() {
    const p = estado.actual;
    let svg = render(p);
    if (p.clase === 'logo') {
      const fondo = FONDOS[$('selFondo').value];
      if (fondo !== 'transparent') svg = svg.replace(/(<\/style>)/, '$1<rect width="512" height="512" fill="' + fondo + '"/>');
    }
    return svg;
  }
  function dims() { if (estado.actual.clase === 'logo') return [512, 512]; return estado.actual.tipo === 'infografia' ? [1400, 860] : [900, 560]; }
  function descargar(blob, nombre) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  $('btnSVG').addEventListener('click', () => {
    descargar(new Blob([svgExport()], { type: 'image/svg+xml' }), estado.actual.id + '.svg');
  });
  function svgABitmap(px) {
    return new Promise((res, rej) => {
      const [w, h] = dims();
      const escala = px / Math.max(w, h);
      const url = URL.createObjectURL(new Blob([svgExport()], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = Math.round(w * escala); c.height = Math.round(h * escala);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = rej;
      img.src = url;
    });
  }
  $('btnPNG').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(+$('rangoTam').value);
      c.toBlob(b => descargar(b, estado.actual.id + '.png'), 'image/png');
    } catch (e) { alert('No se pudo generar el PNG: ' + e.message); }
  });
  $('btnCopiar').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(1800);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      const b = $('btnCopiar'); const t = b.textContent;
      b.textContent = '✓ Copiado';
      setTimeout(() => b.textContent = t, 1500);
    } catch (e) { alert('Tu navegador no permite copiar imágenes. Usa «PNG».'); }
  });

  // abrir el primero al cargar
  pintarChips(); pintarLista();
  const primero = CATALOGO.find(p => p.clase === 'diagrama');
  if (primero) { estado.actual = JSON.parse(JSON.stringify(primero)); configurarBarra(); $('lienzo').innerHTML = render(estado.actual); }
})();
</script>
</body>
</html>
