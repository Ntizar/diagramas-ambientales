<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagramas y Logos Ambientales</title>
<style>
:root {
  --primario: #1A4488; --acento: #CB1823; --texto: #33404F;
  --medio: #8A94A0; --claro: #C9D0D8; --fondo: #F4F6F9; --blanco: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; }
header { background: var(--blanco); border-bottom: 1px solid var(--claro); padding: 18px 28px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 50; }
header .marca { width: 42px; height: 42px; flex: none; }
header h1 { font-size: 20px; font-weight: 700; color: var(--primario); }
header p { font-size: 13px; color: var(--medio); }
.tabs { display: flex; gap: 8px; margin-left: auto; }
.tab { padding: 9px 20px; border-radius: 999px; border: 1.5px solid var(--claro); background: var(--blanco); font-size: 14px; font-weight: 600; cursor: pointer; }
.tab.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
#buscador { flex: 1 1 260px; min-width: 220px; padding: 11px 16px; border: 1.5px solid var(--claro); border-radius: 10px; font-size: 15px; outline: none; background: var(--blanco); }
#buscador:focus { border-color: var(--primario); }
select { padding: 10px 14px; border: 1.5px solid var(--claro); border-radius: 10px; font-size: 14px; background: var(--blanco); color: var(--texto); outline: none; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
.chip { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--claro); background: var(--blanco); font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--primario); }
.chip.activo { background: var(--primario); border-color: var(--primario); color: #fff; }
#contador { font-size: 13px; color: var(--medio); margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.tarjeta { background: var(--blanco); border: 1.5px solid var(--claro); border-radius: 14px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; }
.tarjeta:hover { border-color: var(--primario); box-shadow: 0 8px 24px rgba(26,68,136,.14); transform: translateY(-2px); }
.tarjeta .thumb { display: flex; align-items: center; justify-content: center; padding: 10px; min-height: 120px; }
.tarjeta .thumb svg { width: 100%; height: auto; }
.tarjeta .pie { padding: 10px 14px; border-top: 1px solid #EEF1F5; }
.tarjeta .pie strong { display: block; font-size: 13.5px; font-weight: 600; }
.tarjeta .pie span { font-size: 12px; color: var(--medio); }
#modal { display: none; position: fixed; inset: 0; background: rgba(30,40,55,.55); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
#modal.abierto { display: flex; }
.editor { background: var(--blanco); border-radius: 18px; width: min(1150px, 96vw); max-height: 94vh; overflow: auto; display: grid; grid-template-columns: 1.35fr 1fr; }
@media (max-width: 900px) { .editor { grid-template-columns: 1fr; } }
.editor .vista { padding: 24px; display: flex; align-items: center; justify-content: center; background: var(--fondo); }
.editor .vista svg { max-width: 100%; height: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.editor .panel { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.editor h2 { font-size: 18px; color: var(--primario); }
.editor .sub { font-size: 13px; color: var(--medio); }
.editor label { font-size: 12.5px; font-weight: 600; display: block; margin-bottom: 5px; }
.editor select, .editor input[type="text"], .editor input[type="range"] { width: 100%; }
.editor select, .editor input[type="text"] { padding: 9px 12px; border: 1.5px solid var(--claro); border-radius: 9px; font-size: 14px; outline: none; }
.editor input[type="text"]:focus { border-color: var(--primario); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: transform .12s; }
.swatch:hover { transform: scale(1.12); }
.swatch.activo { border-color: var(--texto); }
#listaTextos { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow: auto; }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn { padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn-primario { background: var(--primario); color: #fff; }
.btn-secundario { background: #E8EDF4; color: var(--primario); }
.btn-cerrar { background: none; border: none; font-size: 26px; color: var(--medio); cursor: pointer; line-height: 1; padding: 4px 8px; align-self: flex-end; }
.cabecera-panel { display: flex; justify-content: space-between; align-items: flex-start; }
footer { text-align: center; padding: 26px; font-size: 12.5px; color: var(--medio); }
.vacio { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--medio); }
.oculto { display: none !important; }
</style>
</head>

<script>
// ============================================================
// PALETA — Esquemas de color derivados del manual de identidad
// corporativa (azul, rojo, gris) + variantes ambientales.
// Cada esquema aporta 4 roles: primario / secundario / acento / neutro.
// ============================================================

const ESQUEMAS = [
  { id: 'corporativo', nombre: 'Corporativo',
    primario: '#1A4488', secundario: '#3D6AB5', acento: '#CB1823', neutro: '#57626E' },
  { id: 'azul-pro', nombre: 'Azul profesional',

  { id: 'verde-eco', nombre: 'Verde sostenible',

    primario: '#1A4488', secundario: '#4C7A3D', acento: '#CB1823', neutro: '#57626E' },
  { id: 'atardecer', nombre: 'Atardecer ambiental',

  { id: 'biodiversidad', nombre: 'Biodiversidad',

  { id: 'oceanico', nombre: 'Oceánico profundo',
    primario: '#0B4F6C', secundario: '#3D8FA8', acento: '#5E9E7E', neutro: '#5F7480' },
  { id: 'monocromo', nombre: 'Monocromo sobrio',
    primario: '#3D4A5C', secundario: '#7B8794', acento: '#1A4488', neutro: '#A6ADB5' },
];

// Mezcla el color hacia blanco (t>0) o negro (t<0)
function tinte(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const destino = t >= 0 ? 255 : 0;
  const f = Math.abs(t);
  r = Math.round(r + (destino - r) * f);
  g = Math.round(g + (destino - g) * f);
  b = Math.round(b + (destino - b) * f);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}



// Grises de apoyo
const GRISES = {
  oscuro: '#2B3440',
  texto: '#33404F',
  medio: '#8A94A0',
  claro: '#C9D0D8',
  fondo: '#F2F4F7',
  blanco: '#FFFFFF',
};

function escapar(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textoSVG(x, y, txt, opts = {}) {
  const { size = 14, peso = 600, color = '#33404F', ancla = 'middle', maxAncho = 140, lineas = null } = opts;
  const parts = [];
  const contenido = lineas || partirTexto(txt, maxAncho, size);
  const altoLinea = size * 1.25;
  const y0 = y - ((contenido.length - 1) * altoLinea) / 2;
  parts.push(`<text x="${x}" y="${y0}" text-anchor="${ancla}" font-family="'Segoe UI', Arial, sans-serif" font-size="${size}" font-weight="${peso}" fill="${color}">`);
  contenido.forEach((l, i) => parts.push(`<tspan x="${x}" dy="${i === 0 ? 0 : altoLinea}">${escapar(l)}</tspan>`));
  parts.push('</text>');
  return parts.join('');
}

function partirTexto(txt, maxAncho, size) {
  const caracteres = Math.max(6, Math.floor(maxAncho / (size * 0.56)));
  const palabras = String(txt).split(/\s+/);
  const lineas = [];
  let actual = '';
  for (const p of palabras) {
    if ((actual + ' ' + p).trim().length <= caracteres) {
      actual = (actual + ' ' + p).trim();
    } else {
      if (actual) lineas.push(actual);
      actual = p;
    }
  }
  if (actual) lineas.push(actual);
  return lineas.slice(0, 3);
}

// Categorías y tipos de diagrama

const TEXTOS_DEFAULT = [
  'Identificación', 'Análisis', 'Diagnóstico', 'Planificación',
  'Implantación', 'Seguimiento', 'Evaluación', 'Mejora continua',
];

function textosDefault(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(TEXTOS_DEFAULT[i % TEXTOS_DEFAULT.length]);
  return out;
}



// ============================================================
// GENERADORES DE LOGOS — 30 conceptos ambientales en SVG 512×512.
// Cada generador: (esquema, variante, uid) → cuerpo SVG.
// Colores por CLASES (.c1..c4 relleno, .st1..st4 trazo, .f blanco)
// para que el estilo (plano/línea/duotono/degradado/insignia)
// se aplique desde catálogo.js sin tocar el dibujo.
// ============================================================

const G = {};

// 1. Árbol copudo
G['arbol'] = (e, v, uid) => {
  let s = '';
  if (v === 1) s += `<circle cx="330" cy="180" r="60" class="c2"/>`;
  s += `<rect x="242" y="270" width="28" height="110" rx="10" class="c4"/>`;

  s += `<circle cx="200" cy="250" r="55" class="c2"/>`;
  s += `<circle cx="315" cy="245" r="52" class="c2"/>`;
  s += `<circle cx="310" cy="160" r="16" class="c3"/>`;
  s += `<path d="M130 392 Q256 366 382 392" class="st4" stroke-width="12"/>`;
  return s;
};

// 2. Pino
G['pino'] = (e, v, uid) => {
  let s = `<polygon points="256,86 168,214 344,214" class="c1"/>
  <polygon points="256,150 148,296 364,296" class="c1"/>
  <polygon points="256,216 128,384 384,384" class="c2"/>
  <rect x="240" y="378" width="32" height="56" rx="8" class="c4"/>`;
  if (v === 1) s += `<circle cx="404" cy="120" r="26" class="c3"/>`;

};

// 3. Hoja
G['hoja'] = (e, v, uid) => {
  let s = `<path d="M256 108 C168 152 152 288 256 404 C360 288 344 152 256 108 Z" class="c1"/>
  <path d="M256 140 L256 380" class="fw" stroke-width="8"/>

  if (v === 1) s += `<circle cx="392" cy="120" r="24" class="c3"/>`;

};

// 4. Montaña
G['montana'] = (e, v, uid) => {

};

// 5. Carretera
G['carretera'] = (e, v, uid) => {

};

G['camino'] = (e, v, uid) => {

G['puente'] = (e, v, uid) => {

G['turbina'] = (e, v, uid) => {

};

// 9. Panel solar
G['panel-solar'] = (e, v, uid) => {
  let s = `<polygon points="130,280 306,280 348,384 88,384" class="c1"/>
  <path d="M187 280 L172 384 M249 280 L249 384 M293 280 L330 384 M109 332 L327 332" class="fw" stroke-width="6"/>
  <path d="M218 384 L218 424" class="st4" stroke-width="12"/>

// ============================================================
// SMARTART — 30 generadores de diagramas (procesos, ciclos,
// comparativas, jerarquías, matrices, relaciones, líneas de
// tiempo y flujos). Reciben (esquema, textos) y devuelven el
// cuerpo SVG sobre lienzo 800x500. Los textos son editables.
// ============================================================


// ============================================================
// GENERADORES SVG — 30 tipos de diagrama.
// Cada generador recibe { esquema, textos } y devuelve un SVG
// string con viewBox 800x500, textos reales (editables) y
// data-attrs para la edición en la UI.
// ============================================================


function fondo() {
  return `<rect width="800" height="500" fill="#FFFFFF"/>`;
}

function caja(x, y, w, h, fill, rx = 10, stroke = null) {
  const s = stroke ? ` stroke="${stroke}" stroke-width="2"` : '';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}"${s}/>`;
}

function flecha(x1, y1, x2, y2, color, ancho = 3) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${ancho}" marker-end="url(#punta)"/>`;
}

function defs() {
  return `<defs><marker id="punta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A94A0"/></marker></defs>`;
}

const GD = {};

// ---------- PROCESOS ----------

GD['proceso-flechas'] = (e, t) => {
  const n = t.length, w = 128, h = 90, gap = (800 - n * w) / (n + 1);
  let s = fondo() + defs();
  t.forEach((txt, i) => {
    const x = gap + i * (w + gap), y = 205;
    const col = i % 2 === 0 ? e.primario : e.secundario;
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 12)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', maxAncho: w - 16 })}</g>`;
    if (i < n - 1) s += flecha(x + w + 4, y + h / 2, x + w + gap - 4, y + h / 2, GRISES.medio);
  });
  return s;
};

GD['proceso-chevrons'] = (e, t) => {
  const n = t.length, w = 150, h = 320, solape = 20;
  const total = n * w - (n - 1) * solape, x0 = (800 - total) / 2;
  let s = fondo();
  t.forEach((txt, i) => {
    const x = x0 + i * (w - solape);
    const col = tinte(i % 2 === 0 ? e.primario : e.secundario, -i * 0.06);
    const punta = i < n - 1 ? 24 : 0;
    s += `<g data-i="${i}"><path d="M${x},90 L${x + w - punta},90 L${x + w},250 L${x + w - punta},410 L${x},410 L${x + (i > 0 ? 24 : 0)},250 Z" fill="${col}"/>`;
    s += textoSVG(x + w / 2 + (i > 0 ? 12 : 0), 250, txt, { color: '#fff', size: 15, maxAncho: w - 50 }) + '</g>';
  });
  return s;
};

GD['proceso-escalera'] = (e, t) => {
  const n = t.length, w = 150, h = 74, paso = Math.min(90, 330 / (n - 1));
  let s = fondo() + defs();
  t.forEach((txt, i) => {
    const x = 60 + i * (w + 28), y = 380 - i * paso;
    const col = tinte(e.primario, i * 0.1);
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 10)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', maxAncho: w - 14 })}</g>`;
    if (i < n - 1) s += flecha(x + w + 2, y - 6, x + w + 26, y - paso + h + 6, GRISES.medio);
  });
  return s;
};

GD['proceso-serpiente'] = (e, t) => {
  const n = t.length, w = 170, h = 80;
  const porFila = Math.ceil(n / 2);
  const gap = Math.min(40, (800 - 80 - porFila * w) / Math.max(1, porFila - 1));
  let s = fondo() + defs();
  t.forEach((txt, i) => {
    const fila = Math.floor(i / porFila), idx = i % porFila;
    const izq = fila % 2 === 0;
    const col = idxInFila => idxInFila % 2 === 0 ? e.primario : e.secundario;
    const x = izq ? 40 + idx * (w + gap) : 40 + (porFila - 1 - idx) * (w + gap);
    const y = fila === 0 ? 120 : 300;
    s += `<g data-i="${i}">${caja(x, y, w, h, col(idx), 12)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', maxAncho: w - 16 })}</g>`;
  });
  // flechas serpiente
  for (let i = 0; i < n - 1; i++) {
    const fila = Math.floor(i / porFila), idx = i % porFila;
    const izq = fila % 2 === 0;
    const x = izq ? 40 + idx * (w + gap) : 40 + (porFila - 1 - idx) * (w + gap);
    const y = fila === 0 ? 120 : 300;
    if (idx < porFila - 1) {
      const sigIzq = izq;
      const xs = sigIzq ? x + w + 4 : x - 4;
      const xe = sigIzq ? x + w + gap - 4 : x - gap + 4;
      s += flecha(xs, y + h / 2, xe, y + h / 2, GRISES.medio);
    } else {
      s += flecha(x + w / 2, y + h + 4, x + w / 2, y + 160 - 4, GRISES.medio);
    }
  }
  return s;
};

GD['proceso-pilares'] = (e, t) => {
  const n = t.length, w = 140, gap = (800 - 60 - n * w) / (n + 1);
  let s = fondo();
  t.forEach((txt, i) => {
    const x = 60 + gap + i * (w + gap);
    const col = tinte(e.primario, i * 0.08);
    const h = 200 + (i % 3) * 30, y = 400 - h;
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 8)}${textoSVG(x + w / 2, y + 30, `${i + 1}. ${txt}`, { color: '#fff', size: 14, maxAncho: w - 14 })}</g>`;
  });
  return s;
};

// ---------- CICLOS ----------

function cicloCircular(e, t, anguloIni = -90) {
  const cx = 400, cy = 250, rCaja = 165, w = 150, h = 64;
  let s = fondo() + defs();
  s += `<circle cx="${cx}" cy="${cy}" r="58" fill="${e.acento}" opacity="0.92"/>`;
  s += textoSVG(cx, cy + 5, 'Mejora continua', { color: '#fff', size: 13, maxAncho: 100 });
  const n = t.length;
  t.forEach((txt, i) => {
    const ang = (anguloIni + (360 / n) * i) * Math.PI / 180;
    const x = cx + rCaja * Math.cos(ang) - w / 2;
    const y = cy + rCaja * Math.sin(ang) - h / 2;
    const col = i % 2 === 0 ? e.primario : e.secundario;
    s += `<g data-i="${i}">${caja(x, y, w, h, col, 32)}${textoSVG(x + w / 2, y + h / 2 + 5, txt, { color: '#fff', size: 13, maxAncho: w - 20 })}</g>`;
    const angMedio = (anguloIni + (360 / n) * (i + 0.5)) * Math.PI / 180;

}

  s += `<line x1="400" y1="100" x2="400" y2="140" stroke="${GRISES.medio}" stroke-width="2.5" marker-end="url(#punta)"/>`;
  s += `<g data-i="1"><polygon points="400,145 520,210 400,275 280,210" fill="${e.acento}"/>${textoSVG(400, 210, t[1], { color: '#fff', size: 13, maxAncho: 180 })}</g>`;
  const ramas = [['Sí', t.slice(2, Math.ceil((t.length - 2) / 2) + 2), 130], ['No', t.slice(Math.ceil((t.length - 2) / 2) + 2), 670]];
  ramas.forEach(([lab, items, x], r) => {
    if (!items.length) return;
    const col = r === 0 ? e.secundario : e.neutro;
    s += `<line x1="${r === 0 ? 280 : 520}" y1="210" x2="${x}" y2="210" stroke="${GRISES.medio}" stroke-width="2.5" marker-end="url(#punta)"/>`;
    s += textoSVG((r === 0 ? 280 : 520) + (r === 0 ? 30 : -30), 195, lab, { color: GRISES.medio, size: 13, peso: 700 });
    items.forEach((txt, i) => {
      const y = 140 + i * 100;
      s += `<g data-i="${2 + (r === 0 ? i : ramas[0][1].length + i)}">${caja(x - 75, y, 150, 70, col, 10)}${textoSVG(x, y + 35, txt, { color: '#fff', size: 12, maxAncho: 134 })}</g>`;
      if (i < items.length - 1) s += `<line x1="${x}" y1="${y + 70}" x2="${x}" y2="${y + 100}" stroke="${GRISES.medio}" stroke-width="2" marker-end="url(#punta)"/>`;
    });
  });
  return s;
};

GD['flujo-embudo'] = (e, t) => {
  let s = fondo();
  const n = t.length, h = 62, gap = 14;
  const y0 = 70, Wmax = 560, Wmin = 160;
  t.forEach((txt, i) => {
    const y = y0 + i * (h + gap);
    const w1 = Wmax - ((Wmax - Wmin) / n) * i;
    const w2 = Wmax - ((Wmax - Wmin) / n) * (i + 1);
    const col = tinte(e.primario, i * 0.09);
    s += `<g data-i="${i}"><polygon points="${400 - w1 / 2},${y} ${400 + w1 / 2},${y} ${400 + w2 / 2},${y + h} ${400 - w2 / 2},${y + h}" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    s += textoSVG(400, y + h / 2 + 5, `${i + 1}. ${txt}`, { color: '#fff', size: 14, maxAncho: w2 - 40 }) + '</g>';
  });
  return s;
};

// CSS del estilo: mapea clases .cN (relleno), .stN (trazo), .f (blanco fijo), .fw (fondo blanco)
function cssEstilo(estiloId, esq, uid) {
  const { primario, secundario, acento, neutro } = esq;
  if (estiloId === 'plano') {
    return `.c1{fill:${primario}}.c2{fill:${secundario}}.c3{fill:${acento}}.c4{fill:${neutro}}
      .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${secundario}}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${neutro}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  if (estiloId === 'linea') {
    return `.c1{fill:${tinte(primario, 0.92)}}.c2{fill:${tinte(secundario, 0.92)}}.c3{fill:${tinte(acento, 0.85)}}.c4{fill:${tinte(neutro, 0.9)}}
      .st1{fill:none;stroke:${primario};stroke-linecap:round;stroke-linejoin:round}.st2{fill:none;stroke:${secundario};stroke-linecap:round;stroke-linejoin:round}
      .st3{fill:none;stroke:${acento};stroke-linecap:round}.st4{fill:none;stroke:${neutro};stroke-linecap:round}
      .f{fill:#fff}.fw{fill:none;stroke:${primario}}`;
  }
  if (estiloId === 'duotono') {
    return `.c1{fill:${primario}}.c2{fill:${tinte(primario, 0.55)}}.c3{fill:${secundario}}.c4{fill:${tinte(primario, 0.78)}}
      .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${tinte(primario, 0.4)}}.st3{fill:none;stroke:${secundario}}.st4{fill:none;stroke:${tinte(primario, 0.25)}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  if (estiloId === 'degradado') {
    return `.c1{fill:url(#gr${uid})}.c2{fill:url(#gr${uid})}.c3{fill:${acento}}.c4{fill:${tinte(primario, 0.35)}}
      .st1{fill:none;stroke:url(#gr${uid})}.st2{fill:none;stroke:url(#gr${uid})}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${tinte(primario, 0.35)}}
      .f{fill:#fff}.fw{fill:none;stroke:#fff}`;
  }
  // insignia
  return `.c1{fill:#fff}.c2{fill:${tinte(secundario, 0.78)}}.c3{fill:${acento}}.c4{fill:${tinte(primario, 0.3)}}
    .st1{fill:none;stroke:${primario}}.st2{fill:none;stroke:${secundario};stroke-linecap:round}.st3{fill:none;stroke:${acento}}.st4{fill:none;stroke:${primario}}
    .f{fill:${primario}}.fw{fill:none;stroke:${primario}}`;
}

function defsEstilo(estiloId, esq, uid) {
  if (estiloId !== 'degradado') return '';
  return `<defs><linearGradient id="gr${uid}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${esq.primario}"/><stop offset="1" stop-color="${esq.secundario}"/>
  </linearGradient></defs>`;
}

function fondoEstilo(estiloId, esq, uid) {
  if (estiloId === 'insignia') {
    return `<circle cx="256" cy="256" r="242" fill="${esq.primario}"/><circle cx="256" cy="256" r="212" fill="none" stroke="${esq.acento}" stroke-width="6"/>`;
  }
  return '';
}

function render(logo) {
  const esq = ESQUEMAS.find(e => e.id === logo.esquema);
  const gen = G[logo.concepto];
  if (!esq) throw new Error('Esquema desconocido: ' + logo.esquema);
  if (!gen) throw new Error('Concepto desconocido: ' + logo.concepto);
  const uid = logo.id.replace(/[^a-z0-9]/gi, '');
  const css = cssEstilo(logo.estilo, esq, uid);
  const cuerpo = gen(esq, logo.variante, uid);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">`
    + `<style>${css}</style>` + defsEstilo(logo.estilo, esq, uid) + fondoEstilo(logo.estilo, esq, uid) + cuerpo + `</svg>`;
}

      pasos: t.pasos,
    });
  });
  // 20 diagramas adicionales: los 20 primeros tipos con otro esquema
  TIPOS_DIAGRAMA.slice(0, 20).forEach((t, i) => {
    items.push({
      id: 'd2-' + t.id,
      clase: 'diagrama',
      tipo: t.id,
      nombre: t.nombre + ' · ' + ESQUEMAS[(i + 1) % 10].nombre,
      categoria: t.cat,
      esquema: ordenEsqD[(i + 1) % 10],
      pasos: t.pasos,
    });
  });

  // ---- 50 LOGOS ----
  const ordenEsqL = ['corporativo','verde-eco','azul-pro','agua','energia','tierra','biodiversidad','atardecer','oceanico','monocromo'];
  const estilos = ['plano','linea','duotono','degradado','insignia'];
  CONCEPTOS.forEach((c, i) => {
    items.push({
      id: 'l-' + c.id + '-v1-' + estilos[i % 5],
      clase: 'logo',
      concepto: c.id,
      nombre: c.nombre,
      categoria: c.cat,
      variante: 1,
      estilo: estilos[i % 5],
      esquema: ordenEsqL[i % 10],
    });
  });
  // 20 logos adicionales: composición 2 con otro estilo/esquema
  CONCEPTOS.slice(0, 20).forEach((c, i) => {
    items.push({
      id: 'l2-' + c.id + '-v2-' + estilos[(i + 2) % 5],
      clase: 'logo',
      concepto: c.id,
      nombre: c.nombre + ' · B',
      categoria: c.cat,
      variante: 2,
      estilo: estilos[(i + 2) % 5],
      esquema: ordenEsqL[(i + 3) % 10],
    });
  });

  return items;
}

const CATALOGO = construirCatalogo();

function render(item) {
  const esq = ESQUEMAS.find(e => e.id === item.esquema);
  if (!esq) throw new Error('Esquema desconocido: ' + item.esquema);
  if (item.clase === 'diagrama') {
    const gen = G[item.tipo];
    if (!gen) throw new Error('Diagrama desconocido: ' + item.tipo);
    const textos = item.textos || textosDefault(item.pasos);
    const cuerpo = gen(esq, textos);
    let extra = '';
    if (item.logoConcepto) {
      const genLogo = G[item.logoConcepto];
      if (genLogo) {
        const uid = 'ins' + item.id.replace(/[^a-z0-9]/gi, '');
        const css = cssEstilo(item.logoEstilo || 'plano', esq, uid);
        const logoCuerpo = genLogo(esq, item.logoVariante || 1, uid);
        const zona = ZONAS_CENTRALES[item.tipo] || { cx: 400, cy: 250, r: 52 };
        // el logo 512x512 se escala al diámetro de la zona central
        const d = zona.r * 2;
        const escala = d / 512;
        extra = '<style>' + css + '</style>'
          + '<g transform="translate(' + (zona.cx - zona.r) + ' ' + (zona.cy - zona.r) + ') scale(' + escala + ')">'
          + defsEstilo(item.logoEstilo || 'plano', esq, uid) + logoCuerpo + '</g>';
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">'
      + extra + cuerpo + '</svg>';
  }
  const gen = G[item.concepto];
  if (!gen) throw new Error('Logo desconocido: ' + item.concepto);
  const uid = item.id.replace(/[^a-z0-9]/gi, '');
  const css = cssEstilo(item.estilo, esq, uid);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">'
    + '<style>' + css + '</style>' + defsEstilo(item.estilo, esq, uid) + fondoEstilo(item.estilo, esq, uid)
    + gen(esq, item.variante, uid) + '</svg>';
}

// Zona central de los diagramas que admiten logo incrustado (círculo central o hueco)
const ZONAS_CENTRALES = {
  'ciclo-4': { cx: 400, cy: 250, r: 54 },
  'ciclo-6': { cx: 400, cy: 250, r: 54 },
  'ciclo-orbital': { cx: 400, cy: 250, r: 46 },
  'ciclo-segmentos': { cx: 400, cy: 250, r: 44 },
  'relacion-radial': { cx: 400, cy: 250, r: 56 },
  'relacion-venn-3': { cx: 400, cy: 245, r: 34 },
  'proceso-pilares': { cx: 400, cy: 330, r: 40 },
};

const CATEGORIAS_UNIFICADAS = [...new Set(CATALOGO.map(p => p.categoria))];



</script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const estado = { pestana: 'diagrama', cat: '', esq: '', q: '', actual: null };
  const FONDOS = { transparente: 'transparent', blanco: '#FFFFFF', claro: '#F0F3F7', oscuro: '#122A4D' };
  const textosGuardados = {};

  // filtros
  const selC = $('filtroEsquema');
  ESQUEMAS.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.nombre;
    selC.appendChild(o);
  });

  // pestañas
  $('tabDiagramas').onclick = () => cambiarPestana('diagrama');
  $('tabLogos').onclick = () => cambiarPestana('logo');
  function cambiarPestana(clase) {
    estado.pestana = clase; estado.cat = '';
    $('tabDiagramas').classList.toggle('activo', clase === 'diagrama');
    $('tabLogos').classList.toggle('activo', clase === 'logo');
    pintarChips(); pintar();
  }

  const chips = $('chips');
  function pintarChips() {
    const cats = [''].concat(CATEGORIAS_UNIFICADAS.filter(c => CATALOGO.some(p => p.clase === estado.pestana && p.categoria === c)));
    chips.innerHTML = '';
    cats.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === 0 ? ' activo' : '');
      b.textContent = c === '' ? 'Todas' : c;
      b.onclick = () => {
        estado.cat = c;
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('activo'));
        b.classList.add('activo');
        pintar();
      };
      chips.appendChild(b);
    });
  }

  $('buscador').addEventListener('input', e => { estado.q = e.target.value.toLowerCase().trim(); pintar(); });
  $('filtroEsquema').addEventListener('change', e => { estado.esq = e.target.value; pintar(); });

  function filtrados() {
    return CATALOGO.filter(p => {
      if (p.clase !== estado.pestana) return false;
      if (estado.cat && p.categoria !== estado.cat) return false;
      if (estado.esq && p.esquema !== estado.esq) return false;
      if (estado.q && !(p.nombre + ' ' + p.categoria).toLowerCase().includes(estado.q)) return false;
      return true;
    });
  }

  function pintar() {
    const lista = filtrados();
    $('contador').textContent = lista.length + ' plantilla' + (lista.length === 1 ? '' : 's');
    const grid = $('grid');
    grid.innerHTML = '';
    if (!lista.length) { grid.innerHTML = '<div class="vacio">Sin resultados.</div>'; return; }
    const frag = document.createDocumentFragment();
    lista.slice(0, 60).forEach(p => frag.appendChild(tarjeta(p)));
    grid.appendChild(frag);
  }

  function tarjeta(p) {
    const card = document.createElement('div');
    card.className = 'tarjeta';
    card.innerHTML = '<div class="thumb">' + render(p) + '</div>' +
      '<div class="pie"><strong>' + p.nombre + '</strong><span>' + p.categoria + '</span></div>';
    card.onclick = () => abrir(p);
    return card;
  }

  // ---- Editor ----
  const modal = $('modal');

  function abrir(p) {
    estado.actual = JSON.parse(JSON.stringify(p));
    estado.actual.textos = (textosGuardados[p.id] || []).slice() || undefined;
    if (!estado.actual.textos || !estado.actual.textos.length) estado.actual.textos = undefined;
    $('titEditor').textContent = p.nombre;
    $('subEditor').textContent = p.categoria;
    const esDiagrama = p.clase === 'diagrama';
    $('bloqueTextos').classList.toggle('oculto', !esDiagrama);
    $('bloquePasos').classList.toggle('oculto', !esDiagrama);
    $('bloqueLogo').classList.toggle('oculto', !esDiagrama);
    $('bloqueFondo').classList.toggle('oculto', esDiagrama);
    if (esDiagrama) {
      const selP = $('selPasos');
      selP.innerHTML = '';
      for (let n = 3; n <= 8; n++) {
        const o = document.createElement('option');
        o.value = n; o.textContent = n + ' elementos';
        if (n === p.pasos) o.selected = true;
        selP.appendChild(o);
      }
      const selL = $('selLogo');
      selL.innerHTML = '<option value="">Sin logo</option>';
      CONCEPTOS.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.nombre;
        if (estado.actual.logoConcepto === c.id) o.selected = true;
        selL.appendChild(o);
      });
      pintarTextos();
    }
    pintarSwatches();
    refrescar();
    modal.classList.add('abierto');
  }

  function pintarSwatches() {
    const sw = $('swatches');
    sw.innerHTML = '';
    ESQUEMAS.forEach(e => {
      const d = document.createElement('div');
      d.className = 'swatch' + (e.id === estado.actual.esquema ? ' activo' : '');
      d.style.background = 'linear-gradient(135deg,' + e.primario + ' 50%,' + e.secundario + ' 50%)';
      d.title = e.nombre;
      d.onclick = () => {
        estado.actual.esquema = e.id;
        pintarSwatches(); refrescar();
      };
      sw.appendChild(d);
    });
  }

  function pintarTextos() {
    const cont = $('listaTextos');
    cont.innerHTML = '';
    const textos = estado.actual.textos || textosDefault(estado.actual.pasos);
    textos.forEach((t, i) => {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = t;
      inp.placeholder = 'Elemento ' + (i + 1);
      inp.addEventListener('input', () => {
        if (!estado.actual.textos) estado.actual.textos = textosDefault(estado.actual.pasos);
        estado.actual.textos[i] = inp.value;
        textosGuardados[estado.actual.id] = estado.actual.textos.slice();
        refrescar();
      });
      cont.appendChild(inp);
    });
  }

  function refrescar() {
    $('vista').innerHTML = render(estado.actual);
  }

  $('selPasos').addEventListener('change', e => {
    const n = +e.target.value;
    const base = estado.actual.textos || textosDefault(estado.actual.pasos);
    const def = textosDefault(n);
    const nuevos = [];
    for (let i = 0; i < n; i++) nuevos.push(base[i] !== undefined ? base[i] : def[i]);
    estado.actual.textos = nuevos; estado.actual.pasos = n;
    textosGuardados[estado.actual.id] = nuevos.slice();
    pintarTextos(); refrescar();
  });
  $('selLogo').addEventListener('change', e => {
    estado.actual.logoConcepto = e.target.value || undefined;
    refrescar();
  });
  $('selFondo').addEventListener('change', e => {
    const v = $('vista');
    v.style.background = FONDOS[e.target.value];
  });
  $('rangoTam').addEventListener('input', e => { $('lblTam').textContent = e.target.value; });
  $('btnReset').addEventListener('click', () => {
    delete textosGuardados[estado.actual.id];
    abrir({ ...estado.actual, textos: undefined });
  });
  $('btnCerrar').addEventListener('click', () => modal.classList.remove('abierto'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('abierto'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('abierto')) modal.classList.remove('abierto'); });

  // ---- Exportación ----
  function svgExport() {
    const p = estado.actual;
    const esDiagrama = p.clase === 'diagrama';
    const fondo = FONDOS[$('selFondo').value];
    let svg = render(p);
    if (!esDiagrama && fondo !== 'transparent') {
      svg = svg.replace(/(<\/style>)/, '$1<rect width="512" height="512" fill="' + fondo + '"/>');
    }
    return svg;
  }

  function dims() {
    return estado.actual.clase === 'diagrama' ? [800, 500] : [512, 512];
  }

  function nombreArchivo(ext) { return estado.actual.id + '.' + ext; }

  function descargar(blob, nombre) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  $('btnSVG').addEventListener('click', () => {
    descargar(new Blob([svgExport()], { type: 'image/svg+xml' }), nombreArchivo('svg'));
  });

  function svgABitmap(px) {
    return new Promise((res, rej) => {
      const [w, h] = dims();
      const escala = px / Math.max(w, h);
      const url = URL.createObjectURL(new Blob([svgExport()], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = Math.round(w * escala); c.height = Math.round(h * escala);
        const ctx = c.getContext('2d');
        const fondo = FONDOS[$('selFondo').value];
        if (estado.actual.clase === 'logo' && fondo !== 'transparent') {
          ctx.fillStyle = fondo; ctx.fillRect(0, 0, c.width, c.height);
        } else if (estado.actual.clase === 'diagrama') {
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c);
      };
      img.onerror = rej;
      img.src = url;
    });
  }

  $('btnPNG').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(+$('rangoTam').value);
      c.toBlob(b => descargar(b, nombreArchivo('png')), 'image/png');
    } catch (e) { alert('No se pudo generar el PNG: ' + e.message); }
  });

  $('btnCopiar').addEventListener('click', async () => {
    try {
      const c = await svgABitmap(1600);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      const b = $('btnCopiar'); const t = b.textContent;
      b.textContent = '✓ Copiada';
      setTimeout(() => b.textContent = t, 1600);
    } catch (e) {
      alert('Tu navegador no permite copiar imágenes. Usa «Descargar PNG».');
    }
  });

  pintarChips(); pintar();
})();
</script>
</body>
</html>
